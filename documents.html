<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Storage - Master Touch Outdoor Living</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body, #root { height: 100%; width: 100%; }
        #root { display: flex; flex-direction: column; }
        .header { background: #FFFFFF; border-bottom: 3px solid #F47920; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; box-shadow: 0 2px 16px rgba(0,0,0,0.08); position: relative; overflow: hidden; }

        .header-title { font-size: 22px; font-weight: 800; color: #1A2B3C; letter-spacing: -.4px; }
        .back-link { color: #F47920 !important; text-decoration: none; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: #FFF4EB; border: 1.5px solid #FDDAB5; border-radius: 8px; transition: all 0.2s; }
        .back-link:hover { background: #FFE6CC; border-color: #F47920; }
        .container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 240px; flex-shrink: 0; background: #FFFFFF; border-right: 1.5px solid #E4EAF0; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; box-shadow: 2px 0 8px rgba(0,0,0,0.04); }
        .sidebar-section-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: #F47920; margin-bottom: 10px; padding: 0 4px; }
        .folder-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 9px; cursor: pointer; transition: all 0.18s; border: 1.5px solid transparent; font-size: 14px; font-weight: 500; color: #3A5060; }
        .folder-item:hover { background: #FFF4EB; border-color: #FDDAB5; color: #1A2B3C; }
        .folder-item.active { background: linear-gradient(135deg,#F47920,#E85D10); color: #FFFFFF; border-color: transparent; box-shadow: 0 3px 12px rgba(244,121,32,0.3); font-weight: 600; }
        .folder-name { display: flex; align-items: center; gap: 7px; flex: 1; }

        .folder-item.active .folder-count { background: rgba(255,255,255,0.25); color: #FFFFFF; }
        .create-folder-btn { margin-top: 10px; padding: 10px; background: #FFFFFF; border: 1.5px dashed #FDDAB5; border-radius: 9px; color: #F47920; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; width: 100%; }
        .create-folder-btn:hover { background: #FFF4EB; border-style: solid; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 28px 32px; gap: 20px; }
        .content-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
        .content-title { font-size: 22px; font-weight: 800; color: #1A2B3C; letter-spacing: -.3px; }
        .search-bar { padding: 9px 16px; background: #FFFFFF; border: 1.5px solid #E4EAF0; border-radius: 9px; font-size: 14px; color: #1A2B3C; width: 240px; outline: none; transition: all 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .search-bar::placeholder { color: #A0B0BC; }
        .search-bar:focus { border-color: #F47920; box-shadow: 0 0 0 3px rgba(244,121,32,0.1); }
        .gdrive-panel { background: #FFFFFF; border: 1.5px solid #E4EAF0; border-radius: 14px; padding: 22px 24px; box-shadow: 0 1px 6px rgba(0,0,0,0.05); flex-shrink: 0; }
        .gdrive-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .gdrive-title { font-size: 15px; font-weight: 700; color: #1A2B3C; display: flex; align-items: center; gap: 9px; }
        .gdrive-icon-box { width: 30px; height: 30px; background: linear-gradient(135deg,#FFF4EB,#FFE6CC); border: 1.5px solid #FDDAB5; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .gdrive-subtitle { font-size: 12px; color: #A0B0BC; }
        .gdrive-connected-box { display: flex; align-items: center; gap: 12px; padding: 13px 16px; background: #E8F9EF; border: 1.5px solid #A8DFC0; border-radius: 10px; font-size: 13.5px; color: #1A5C35; font-weight: 600; flex-wrap: wrap; }

        .gdrive-form { display: flex; flex-direction: column; gap: 14px; }
        .gdrive-form label { font-size: 11.5px; font-weight: 700; color: #4A6170; text-transform: uppercase; letter-spacing: 0.8px; display: block; margin-bottom: 4px; }

        .gdrive-row > div { flex: 1; }
        .gdrive-btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .gdrive-btn { padding: 10px 18px; background: linear-gradient(135deg,#F47920,#E85D10); color: #FFFFFF; border: none; border-radius: 8px; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 3px 10px rgba(244,121,32,0.28); display: inline-flex; align-items: center; gap: 7px; }
        .gdrive-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(244,121,32,0.38); }
        .gdrive-btn.sec { background: #F8FAFC; color: #4A6170; border: 1.5px solid #E4EAF0; box-shadow: none; }
        .gdrive-btn.sec:hover { background: #FFF4EB; border-color: #FDDAB5; color: #F47920; transform: none; box-shadow: none; }
        .gdrive-btn.disc { background: #FFF5F5; color: #DC3545; border: 1.5px solid #FADADD; box-shadow: none; font-size: 12.5px; padding: 8px 14px; }
        .gdrive-btn.disc:hover { background: #FFE8EA; border-color: #DC3545; transform: none; box-shadow: none; }
        .gdrive-help { font-size: 12px; color: #6B7E8E; line-height: 1.65; padding: 12px 14px; background: #F8FAFC; border-radius: 8px; border: 1px solid #EEF1F4; }

        .gdrive-help a:hover { text-decoration: underline; }
        .gdrive-notice { font-size: 12px; font-weight: 600; }
        .gdrive-edit-btn { font-size: 12px; color: #A0B0BC; font-weight: 500; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }
        .gdrive-edit-btn:hover { color: #F47920; }
        .upload-section { background: #FFFFFF; border: 1.5px solid #E4EAF0; border-radius: 14px; padding: 24px; box-shadow: 0 1px 6px rgba(0,0,0,0.05); flex-shrink: 0; }
        .upload-zone { border: 2px dashed #FDDAB5; border-radius: 10px; padding: 32px 20px; text-align: center; cursor: pointer; transition: all 0.25s; background: #FFFAF7; }
        .upload-zone:hover { border-color: #F47920; background: #FFF4EB; }
        .upload-zone.drag-over { border-color: #F47920; background: #FFE6CC; }
        .upload-zone input { display: none; }
        .upload-icon { font-size: 2.2rem; margin-bottom: 10px; opacity: 0.85; }
        .upload-text { color: #1A2B3C; font-weight: 600; font-size: 15px; margin-bottom: 5px; }
        .upload-subtext { color: #8A9BAB; font-size: 13px; margin-bottom: 16px; }
        .upload-button { padding: 10px 24px; background: linear-gradient(135deg,#F47920,#E85D10); color: #FFFFFF; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 3px 10px rgba(244,121,32,0.3); }
        .upload-button:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(244,121,32,0.4); }
        .file-size-warning { color: #E87520; font-size: 12.5px; margin-top: 10px; font-weight: 500; }
        .upload-progress { margin-top: 14px; padding: 12px 16px; background: #F8FAFC; border-radius: 8px; border: 1px solid #E4EAF0; }
        .progress-bar { width: 100%; height: 6px; background: #EEF1F4; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg,#F47920,#E85D10); transition: width 0.3s ease; border-radius: 6px; }
        .storage-info { background: #FFFFFF; border: 1.5px solid #E4EAF0; border-radius: 12px; padding: 16px 20px; box-shadow: 0 1px 5px rgba(0,0,0,0.04); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; flex-shrink: 0; }
        .storage-bar { flex: 1; min-width: 200px; }
        .storage-label { display: flex; justify-content: space-between; font-size: 13px; color: #6B7E8E; margin-bottom: 9px; font-weight: 500; }
        .storage-label span:last-child { font-weight: 600; color: #1A2B3C; }
        .storage-progress { width: 100%; height: 7px; background: #EEF1F4; border-radius: 6px; overflow: hidden; }
        .storage-fill { height: 100%; background: linear-gradient(90deg,#F47920,#E85D10); border-radius: 6px; transition: width 0.4s ease; }
        .storage-fill.warning { background: linear-gradient(90deg,#DC3545,#C0392B); }
        .storage-fill.gdrive { background: linear-gradient(90deg,#1A9E50,#16854A); }
        .documents-section { background: #FFFFFF; border: 1.5px solid #E4EAF0; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.05); min-height: 200px; }
        .documents-empty { text-align: center; padding: 40px 20px; color: #A0B0BC; }
        .documents-empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }
        .documents-table { width: 100%; border-collapse: collapse; }
        .table-header { background: linear-gradient(135deg,#F8FAFB,#F2F5F8); border-bottom: 1.5px solid #E4EAF0; }
        .table-header-cell { padding: 12px 16px; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: #6B7E8E; text-align: left; }
        .table-row { border-bottom: 1px solid #EEF1F4; transition: background 0.15s; }
        .table-row:last-child { border-bottom: none; }
        .table-row:hover { background: #FFFAF7; }
        .table-cell { padding: 13px 16px; vertical-align: middle; }
        .file-name { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; color: #1A2B3C; word-break: break-word; }
        .file-icon { font-size: 1.6rem; flex-shrink: 0; }
        .file-size { font-size: 13px; color: #6B7E8E; }
        .file-date { font-size: 13px; color: #6B7E8E; }
        .table-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .action-button { padding: 5px 11px; border-radius: 7px; border: 1.5px solid #E4EAF0; background: #F8FAFC; color: #4A6170; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.18s; white-space: nowrap; }
        .action-button:hover { background: #FFF4EB; border-color: #FDDAB5; color: #F47920; }
        .action-button.delete { color: #DC3545; border-color: #FADADD; background: #FFF5F5; }
        .action-button.delete:hover { background: #FFE8EA; border-color: #DC3545; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: #FFFFFF; border: 1.5px solid #E4EAF0; border-radius: 14px; padding: 28px; max-width: 480px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
        .modal-header { font-size: 18px; font-weight: 700; margin-bottom: 18px; color: #1A2B3C; }
        .modal-input { width: 100%; padding: 9px 13px; background: #F8FAFC; border: 1.5px solid #E4EAF0; border-radius: 8px; color: #1A2B3C; margin-bottom: 12px; font-size: 14px; font-family: inherit; outline: none; }
        .modal-input:focus { border-color: #F47920; background: #FFFAF7; box-shadow: 0 0 0 3px rgba(244,121,32,0.1); }
        .modal-textarea { width: 100%; padding: 9px 13px; background: #F8FAFC; border: 1.5px solid #E4EAF0; border-radius: 8px; color: #1A2B3C; margin-bottom: 12px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 100px; outline: none; }
        .modal-textarea:focus { border-color: #F47920; background: #FFFAF7; box-shadow: 0 0 0 3px rgba(244,121,32,0.1); }
        .modal-select { width: 100%; padding: 9px 13px; background: #F8FAFC; border: 1.5px solid #E4EAF0; border-radius: 8px; color: #1A2B3C; margin-bottom: 12px; font-size: 14px; font-family: inherit; outline: none; }
        .modal-select:focus { border-color: #F47920; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
        .modal-button { padding: 9px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13.5px; transition: all 0.2s; }
        .modal-button.primary { background: linear-gradient(135deg,#F47920,#E85D10); color: #FFFFFF; box-shadow: 0 3px 10px rgba(244,121,32,0.3); }
        .modal-button.primary:hover { transform: translateY(-1px); }
        .modal-button.secondary { background: #F8FAFC; color: #4A6170; border: 1.5px solid #E4EAF0; }
        .modal-button.secondary:hover { background: #FFF4EB; border-color: #FDDAB5; color: #F47920; }
        ::-webkit-scrollbar { width: 7px; }
        ::-webkit-scrollbar-track { background: #F0F3F7; }
        ::-webkit-scrollbar-thumb { background: #D0D8E0; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #F47920; }
        @media (max-width: 768px) { .container { flex-direction: column; } .sidebar { width: 100%; border-right: none; border-bottom: 1.5px solid #E4EAF0; max-height: 260px; } .main-content { padding: 16px; } .gdrive-row { flex-direction: column; } .search-bar { width: 100%; } }
    </style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const generateId = () => crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random();
const formatFileSize = (b) => { if(!b) return '0 B'; const k=1024,s=['B','KB','MB','GB'],i=Math.floor(Math.log(b)/Math.log(k)); return +(b/Math.pow(k,i)).toFixed(2)+' '+s[i]; };
const getFileType = (n) => { const e=n.split('.').pop().toLowerCase(); if(['pdf'].includes(e)) return 'pdf'; if(['jpg','jpeg','png','gif','webp','svg'].includes(e)) return 'image'; if(['doc','docx','txt','rtf'].includes(e)) return 'doc'; if(['xls','xlsx','csv'].includes(e)) return 'spreadsheet'; return 'other'; };
const getFileIcon = (t) => ({'pdf':'📄','image':'🖼️','doc':'📋','spreadsheet':'📊','other':'📦'}[t]||'📦');
const formatDate = (d) => new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
const getStorageUsage = (docs) => docs.reduce((t,d)=>t+(d.base64Data||'').length*0.75,0);

const GDrive = {
  isConnected: () => localStorage.getItem('mt_gdrive_connected') === 'true',
  getConfig: () => JSON.parse(localStorage.getItem('mt_gdrive_config')||'{}'),
  getFolderName: () => localStorage.getItem('mt_gdrive_folder_name')||'Master Touch Documents',
  getFolderId: () => localStorage.getItem('mt_gdrive_folder_id')||null,
  loadGapi: () => new Promise((res,rej) => {
    if(window.gapi){res();return;}
    const s=document.createElement('script');
    s.src='https://apis.google.com/js/api.js';
    s.onload=res; s.onerror=()=>rej(new Error('Failed to load Google API'));
    document.head.appendChild(s);
  }),
  connect: async (clientId, apiKey, folderName, onStatus) => {
    onStatus('Loading Google API...','#F47920');
    await GDrive.loadGapi();
    onStatus('Initializing...','#F47920');
    await new Promise((res,rej)=>gapi.load('client:auth2',{callback:res,onerror:rej}));
    await gapi.client.init({ apiKey, clientId, discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'], scope:'https://www.googleapis.com/auth/drive.file' });
    const auth=gapi.auth2.getAuthInstance();
    if(!auth.isSignedIn.get()){ onStatus('Opening sign-in...','#F47920'); await auth.signIn(); }
    onStatus('Setting up folder...','#F47920');
    const lr=await gapi.client.drive.files.list({q:"name='"+folderName+"' and mimeType='application/vnd.google-apps.folder' and trashed=false",fields:'files(id,name)',spaces:'drive'});
    let fid;
    if(lr.result.files&&lr.result.files.length>0){ fid=lr.result.files[0].id; }
    else { const cr=await gapi.client.drive.files.create({resource:{name:folderName,mimeType:'application/vnd.google-apps.folder'},fields:'id'}); fid=cr.result.id; }
    localStorage.setItem('mt_gdrive_connected','true');
    localStorage.setItem('mt_gdrive_folder_id',fid);
    localStorage.setItem('mt_gdrive_folder_name',folderName);
    onStatus('Connected! Refreshing...','#1A9E50');
    setTimeout(()=>window.location.reload(),1000);
  },
  disconnect: () => {
    ['mt_gdrive_connected','mt_gdrive_folder_id','mt_gdrive_folder_name'].forEach(k=>localStorage.removeItem(k));
    if(window.gapi&&window.gapi.auth2){try{gapi.auth2.getAuthInstance().signOut();}catch(e){}}
    window.location.reload();
  },
  getToken: () => gapi.auth2.getAuthInstance().currentUser.get().getAuthResponse().access_token,
  uploadFile: async (file, folder) => {
    if(!GDrive.isConnected()) return null;
    const fid=GDrive.getFolderId(); if(!fid) return null;
    const meta={name:file.name,parents:[fid],appProperties:{mtFolder:folder}};
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
    form.append('file',file);
    const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,modifiedTime,webViewLink',{method:'POST',headers:{Authorization:'Bearer '+GDrive.getToken()},body:form});
    return res.ok ? await res.json() : null;
  },
  listFiles: async (folder) => {
    if(!GDrive.isConnected()) return [];
    const fid=GDrive.getFolderId(); if(!fid) return [];
    const res=await gapi.client.drive.files.list({q:"'"+fid+"' in parents and trashed=false and appProperties has { key='mtFolder' and value='"+folder+"' }",fields:'files(id,name,size,modifiedTime,webViewLink)',orderBy:'modifiedTime desc'});
    return res.result.files||[];
  },
  deleteFile: async (id) => { await fetch('https://www.googleapis.com/drive/v3/files/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+GDrive.getToken()}}); },
  renameFile: async (id, name) => { await fetch('https://www.googleapis.com/drive/v3/files/'+id,{method:'PATCH',headers:{Authorization:'Bearer '+GDrive.getToken(),'Content-Type':'application/json'},body:JSON.stringify({name})}); }
};

const GDrivePanel = () => {
  const cfg=GDrive.getConfig();
  const connected=GDrive.isConnected();
  const [cid,setCid]=useState(cfg.clientId||'');
  const [key,setKey]=useState(cfg.apiKey||'');
  const [fn,setFn]=useState(cfg.folderName||'Master Touch Documents');
  const [notice,setNotice]=useState('');
  const [noticeColor,setNoticeColor]=useState('#1A9E50');
  const [showEdit,setShowEdit]=useState(false);
  const saveOnly=()=>{
    if(!cid.trim()||!key.trim()){setNotice('Enter both Client ID and API Key');setNoticeColor('#E87520');return;}
    localStorage.setItem('mt_gdrive_config',JSON.stringify({clientId:cid.trim(),apiKey:key.trim(),folderName:fn.trim()||'Master Touch Documents'}));
    setNotice('Settings saved!');setNoticeColor('#1A9E50');setTimeout(()=>setNotice(''),2500);
  };
  const connect=async()=>{
    if(!cid.trim()||!key.trim()){setNotice('Enter both Client ID and API Key');setNoticeColor('#E87520');return;}
    localStorage.setItem('mt_gdrive_config',JSON.stringify({clientId:cid.trim(),apiKey:key.trim(),folderName:fn.trim()||'Master Touch Documents'}));
    try { await GDrive.connect(cid.trim(),key.trim(),fn.trim()||'Master Touch Documents',(m,c)=>{setNotice(m);setNoticeColor(c);}); }
    catch(err) { const m=err.error==='popup_blocked_by_browser'?'Popup blocked! Allow popups.':err.error==='access_denied'?'Access denied.':err.error==='idpiframe_initialization_failed'?'Invalid Client ID or domain not authorized.':'Error: '+(err.error||err.message||'Unknown'); setNotice(m);setNoticeColor('#DC3545'); }
  };
  const form=(
    <div className="gdrive-form">
      <div className="gdrive-help">
        <strong>Setup Guide:</strong><br/>
        1. <a href="https://console.cloud.google.com" target="_blank">Google Cloud Console</a> - Create/select project<br/>
        2. Enable <strong>Google Drive API</strong> (APIs &amp; Services - Library)<br/>
        3. Create <strong>OAuth 2.0 Client ID</strong> (Web Application type)<br/>
        4. Authorized JavaScript origins: <code style={{background:'#eee',padding:'1px 5px',borderRadius:'3px',fontSize:'11px'}}>https://mastertouchoutdoorliving.github.io</code><br/>
        5. Create an <strong>API Key</strong> (restrict to Drive API)<br/>
        6. Paste below and click Connect
      </div>
      <div className="gdrive-row">
        <div><label>OAuth Client ID</label><input type="text" placeholder="xxxx.apps.googleusercontent.com" value={cid} onChange={e=>setCid(e.target.value)}/></div>
        <div><label>API Key</label><input type="password" placeholder="AIzaSy..." value={key} onChange={e=>setKey(e.target.value)}/></div>
      </div>
      <div><label>Drive Folder Name</label><input type="text" placeholder="Master Touch Documents" value={fn} onChange={e=>setFn(e.target.value)}/></div>
      <div className="gdrive-btn-row">
        <button className="gdrive-btn" onClick={connect}>Connect to Google Drive</button>
        <button className="gdrive-btn sec" onClick={saveOnly}>Save Settings</button>
        {notice&&<span className="gdrive-notice" style={{color:noticeColor}}>{notice}</span>}
      </div>
    </div>
  );
  if(connected) return(
    <div className="gdrive-panel">
      <div className="gdrive-header">
        <div className="gdrive-title"><div className="gdrive-icon-box">☁️</div>Google Drive Storage</div>
        <button className="gdrive-edit-btn" onClick={()=>setShowEdit(!showEdit)}>{showEdit?'Hide':'Edit settings'}</button>
      </div>
      <div className="gdrive-connected-box">
        <span style={{fontSize:'20px'}}>✅</span>
        <div><div>Connected to Google Drive</div><div className="gdrive-folder-path">📁 {GDrive.getFolderName()}</div></div>
        <button className="gdrive-btn disc" style={{marginLeft:'auto'}} onClick={GDrive.disconnect}>Disconnect</button>
      </div>
      {showEdit&&<div style={{marginTop:'16px'}}>{form}</div>}
    </div>
  );
  return(
    <div className="gdrive-panel">
      <div className="gdrive-header">
        <div className="gdrive-title"><div className="gdrive-icon-box">☁️</div>Connect Google Drive</div>
        <span className="gdrive-subtitle">Unlimited storage, synced across devices</span>
      </div>
      {form}
    </div>
  );
};

const DocumentApp = () => {
  const DEFAULT_FOLDERS=['Insurance','Disclaimers','Contracts','Safety Documents','Employee Forms','Licenses & Permits','Other'];
  const connected=GDrive.isConnected();
  const [folders,setFolders]=useState(()=>{const s=localStorage.getItem('mt-folders');return s?JSON.parse(s):DEFAULT_FOLDERS;});
  const [documents,setDocuments]=useState(()=>{const s=localStorage.getItem('mt-documents');return s?JSON.parse(s):[];});
  const [selectedFolder,setSelectedFolder]=useState(DEFAULT_FOLDERS[0]);
  const [searchTerm,setSearchTerm]=useState('');
  const [uploadProgress,setUploadProgress]=useState(0);
  const [showUploadProgress,setShowUploadProgress]=useState(false);
  const [showCreateFolder,setShowCreateFolder]=useState(false);
  const [showNotes,setShowNotes]=useState(null);
  const [noteText,setNoteText]=useState('');
  const [showMoveFolder,setShowMoveFolder]=useState(null);
  const [showRename,setShowRename]=useState(null);
  const [renameText,setRenameText]=useState('');
  const [driveFiles,setDriveFiles]=useState([]);
  const [driveLoading,setDriveLoading]=useState(false);
  const fileInputRef=useRef(null);
  useEffect(()=>{localStorage.setItem('mt-folders',JSON.stringify(folders));},[folders]);
  useEffect(()=>{localStorage.setItem('mt-documents',JSON.stringify(documents));},[documents]);
  useEffect(()=>{
    if(connected){
      setDriveLoading(true);
      GDrive.listFiles(selectedFolder).then(f=>{setDriveFiles(f);setDriveLoading(false);}).catch(()=>setDriveLoading(false));
    }
  },[selectedFolder,connected]);
  const filteredDocs=documents.filter(d=>(!selectedFolder||d.folder===selectedFolder)&&(!searchTerm||d.name.toLowerCase().includes(searchTerm.toLowerCase())));
  const getFolderCount=f=>documents.filter(d=>d.folder===f).length;
  const handleFileUpload=useCallback(async(files)=>{
    for(let i=0;i<files.length;i++){
      const file=files[i];
      if(connected){
        setUploadProgress(Math.round(((i+0.5)/files.length)*100));setShowUploadProgress(true);
        const df=await GDrive.uploadFile(file,selectedFolder);
        if(df) setDriveFiles(prev=>[{id:df.id,name:df.name,size:df.size,modifiedTime:df.modifiedTime,webViewLink:df.webViewLink},...prev]);
        setUploadProgress(Math.round(((i+1)/files.length)*100));
      } else {
        if(file.size>5*1024*1024){alert('File "'+file.name+'" exceeds 5MB limit');continue;}
        await new Promise(res=>{
          const r=new FileReader();
          r.onload=e=>{setDocuments(prev=>[...prev,{id:generateId(),name:file.name,folder:selectedFolder,fileType:getFileType(file.name),fileSize:file.size,base64Data:e.target.result,uploadDate:new Date().toISOString(),notes:''}]);setUploadProgress(Math.round(((i+1)/files.length)*100));res();};
          r.readAsDataURL(file);
        });
        setShowUploadProgress(true);
      }
    }
    setTimeout(()=>{setShowUploadProgress(false);setUploadProgress(0);},2000);
  },[selectedFolder,connected]);
  const handleDragOver=e=>{e.preventDefault();e.currentTarget.classList.add('drag-over');};
  const handleDragLeave=e=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');};
  const handleDrop=e=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');handleFileUpload(e.dataTransfer.files);};
  const downloadDoc=doc=>{const a=document.createElement('a');a.href=doc.base64Data;a.download=doc.name;document.body.appendChild(a);a.click();document.body.removeChild(a);};
  const deleteDoc=id=>{if(confirm('Delete this document?'))setDocuments(prev=>prev.filter(d=>d.id!==id));};
  const deleteDriveFile=async id=>{if(!confirm('Delete from Google Drive?'))return;await GDrive.deleteFile(id);setDriveFiles(prev=>prev.filter(f=>f.id!==id));};
  const createFolder=n=>{if(n.trim()&&!folders.includes(n)){setFolders(prev=>[...prev,n]);setShowCreateFolder(false);}};
  const moveDoc=(id,nf)=>{setDocuments(prev=>prev.map(d=>d.id===id?{...d,folder:nf}:d));setShowMoveFolder(null);};
  const updateNotes=id=>{setDocuments(prev=>prev.map(d=>d.id===id?{...d,notes:noteText}:d));setShowNotes(null);setNoteText('');};
  const renameDoc=id=>{if(renameText.trim())setDocuments(prev=>prev.map(d=>d.id===id?{...d,name:renameText.trim()}:d));setShowRename(null);setRenameText('');};
  const renameDrive=async(id,n)=>{await GDrive.renameFile(id,n);setDriveFiles(prev=>prev.map(f=>f.id===id?{...f,name:n}:f));};
  const storageUsed=getStorageUsage(documents);
  const storagePct=Math.min((storageUsed/(5*1024*1024))*100,100);
  const allFiles=connected
    ?driveFiles.map(f=>({...f,isDrive:true,fileType:getFileType(f.name),fileSize:parseInt(f.size)||0,uploadDate:f.modifiedTime})).filter(f=>!searchTerm||f.name.toLowerCase().includes(searchTerm.toLowerCase()))
    :filteredDocs;
  return(<>
    <div className="header">
      <div className="header-left">
        <div className="logo">
          <svg width="32" height="32" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#F47920"/><stop offset="100%" stopColor="#E85D10"/></linearGradient></defs>
            <path d="M50 5 L90 25 L90 55 Q90 80 50 95 Q10 80 10 55 L10 25 Z" fill="url(#sh)" opacity=".15" stroke="#F47920" strokeWidth="2"/>
            <text x="50" y="62" textAnchor="middle" fontFamily="Georgia,serif" fontSize="40" fontWeight="bold" fontStyle="italic" fill="#F47920">M</text>
            <text x="62" y="72" textAnchor="middle" fontFamily="Georgia,serif" fontSize="22" fontWeight="bold" fontStyle="italic" fill="#00BCC8">t</text>
          </svg>
        </div>
        <h1 className="header-title">Document Storage</h1>
      </div>
      <a href="index.html" className="back-link">Back to Hub</a>
    </div>
    <div className="container">
      <div className="sidebar">
        <div className="sidebar-section-title">Folders</div>
        {folders.map(f=>(<div key={f} className={"folder-item "+(selectedFolder===f?'active':'')} onClick={()=>setSelectedFolder(f)}><span className="folder-name">📁 {f}</span><span className="folder-count">{getFolderCount(f)}</span></div>))}
        <button className="create-folder-btn" onClick={()=>setShowCreateFolder(true)}>+ New Folder</button>
      </div>
      <div className="main-content">
        <div className="content-header">
          <h2 className="content-title">{selectedFolder}</h2>
          <input type="text" className="search-bar" placeholder="Search documents..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}/>
        </div>
        <GDrivePanel/>
        <div className="upload-section">
          <div className="upload-zone" onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop} onClick={()=>fileInputRef.current?.click()}>
            <input ref={fileInputRef} type="file" multiple onChange={e=>handleFileUpload(e.target.files)}/>
            <div className="upload-icon">📤</div>
            <div className="upload-text">Drag and drop files here</div>
            <div className="upload-subtext">or click to select files</div>
            <button className="upload-button">Choose Files</button>
            <div className="file-size-warning">{connected?'Files saved to Google Drive (unlimited)':'Local storage only (5MB limit) - Connect Google Drive above for unlimited storage'}</div>
          </div>
          {showUploadProgress&&(<div className="upload-progress"><div className="progress-bar"><div className="progress-fill" style={{width:uploadProgress+'%'}}></div></div><div style={{fontSize:'12px',color:'#6B7E8E',textAlign:'center'}}>{connected?'Uploading to Drive...':'Saving...'} {Math.round(uploadProgress)}%</div></div>)}
        </div>
        {!connected&&(<div className="storage-info"><div className="storage-bar"><div className="storage-label"><span>Local Storage</span><span>{formatFileSize(storageUsed)} / 5 MB</span></div><div className="storage-progress"><div className={"storage-fill "+(storagePct>80?'warning':'')} style={{width:storagePct+'%'}}></div></div></div><span style={{fontSize:'13px',color:storagePct>80?'#DC3545':'#6B7E8E',fontWeight:'600'}}>{Math.round(storagePct)}% full</span></div>)}
        {connected&&(<div className="storage-info"><div className="storage-bar"><div className="storage-label"><span>Google Drive</span><span style={{color:'#1A9E50'}}>Connected - Unlimited Storage</span></div><div className="storage-progress"><div className="storage-fill gdrive" style={{width:'15%'}}></div></div></div></div>)}
        <div className="documents-section">
          {driveLoading?(<div className="documents-empty"><div style={{fontSize:'1.5rem',marginBottom:'8px'}}>⏳</div><p>Loading from Google Drive...</p></div>)
          :allFiles.length===0?(<div className="documents-empty"><div className="documents-empty-icon">📂</div><p>{searchTerm?'No documents found':'No documents yet'}</p><p style={{fontSize:'13px',marginTop:'6px'}}>{searchTerm?'Try a different search':'Upload a document to get started'}</p></div>)
          :(<table className="documents-table"><thead className="table-header"><tr><th className="table-header-cell">Name</th><th className="table-header-cell">Size</th><th className="table-header-cell">Date</th><th className="table-header-cell">Actions</th></tr></thead><tbody>
            {allFiles.map(doc=>(<tr key={doc.id} className="table-row">
              <td className="table-cell"><div className="file-name"><span className="file-icon">{getFileIcon(doc.fileType)}</span>{doc.name}</div></td>
              <td className="table-cell file-size">{formatFileSize(doc.fileSize)}</td>
              <td className="table-cell file-date">{formatDate(doc.uploadDate)}</td>
              <td className="table-cell"><div className="table-actions">
                {doc.isDrive?<button className="action-button" onClick={()=>{const n=prompt('New name:',doc.name);if(n&&n.trim())renameDrive(doc.id,n.trim());}}>✏️ Rename</button>:<button className="action-button" onClick={()=>{setShowRename(doc.id);setRenameText(doc.name);}}>✏️ Rename</button>}
                <button className="action-button" onClick={()=>doc.isDrive?window.open(doc.webViewLink,'_blank'):downloadDoc(doc)}>⬇️ {doc.isDrive?'Open':'Download'}</button>
                {!doc.isDrive&&<button className="action-button" onClick={()=>{setShowNotes(doc.id);setNoteText(doc.notes||'');}}>📝 Notes</button>}
                {!doc.isDrive&&<button className="action-button" onClick={()=>setShowMoveFolder(doc.id)}>📁 Move</button>}
                <button className="action-button delete" onClick={()=>doc.isDrive?deleteDriveFile(doc.id):deleteDoc(doc.id)}>🗑️ Delete</button>
              </div></td>
            </tr>))}
          </tbody></table>)}
        </div>
      </div>
    </div>
    {showCreateFolder&&<CreateFolderModal onClose={()=>setShowCreateFolder(false)} onCreate={createFolder} existingFolders={folders}/>}
    {showNotes&&<NotesModal onClose={()=>setShowNotes(null)} onSave={()=>updateNotes(showNotes)} noteText={noteText} setNoteText={setNoteText}/>}
    {showMoveFolder&&<MoveFolderModal folders={folders} currentFolder={documents.find(d=>d.id===showMoveFolder)?.folder} onClose={()=>setShowMoveFolder(null)} onMove={nf=>moveDoc(showMoveFolder,nf)}/>}
    {showRename&&<RenameModal onClose={()=>{setShowRename(null);setRenameText('');}} onSave={()=>renameDoc(showRename)} renameText={renameText} setRenameText={setRenameText}/>}
  </>);
};

const CreateFolderModal=({onClose,onCreate,existingFolders})=>{const[n,setN]=useState('');const r=useRef(null);useEffect(()=>r.current?.focus(),[]);const go=()=>{if(n.trim()){if(existingFolders.includes(n)){alert('Exists');return;}onCreate(n);}};return(<div className="modal-overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-header">Create New Folder</div><input ref={r} type="text" className="modal-input" placeholder="Folder name" value={n} onChange={e=>setN(e.target.value)} onKeyPress={e=>e.key==='Enter'&&go()}/><div className="modal-buttons"><button className="modal-button secondary" onClick={onClose}>Cancel</button><button className="modal-button primary" onClick={go}>Create</button></div></div></div>);};
const NotesModal=({onClose,onSave,noteText,setNoteText})=>{const r=useRef(null);useEffect(()=>r.current?.focus(),[]);return(<div className="modal-overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-header">Document Notes</div><textarea ref={r} className="modal-textarea" placeholder="Add notes..." value={noteText} onChange={e=>setNoteText(e.target.value)}/><div className="modal-buttons"><button className="modal-button secondary" onClick={onClose}>Cancel</button><button className="modal-button primary" onClick={onSave}>Save Notes</button></div></div></div>);};
const MoveFolderModal=({folders,currentFolder,onClose,onMove})=>{const[sel,setSel]=useState('');const avail=folders.filter(f=>f!==currentFolder);return(<div className="modal-overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-header">Move Document</div><select className="modal-select" value={sel} onChange={e=>setSel(e.target.value)}><option value="">-- Select Folder --</option>{avail.map(f=><option key={f} value={f}>{f}</option>)}</select><div className="modal-buttons"><button className="modal-button secondary" onClick={onClose}>Cancel</button><button className="modal-button primary" onClick={()=>sel&&onMove(sel)} disabled={!sel}>Move</button></div></div></div>);};
const RenameModal=({onClose,onSave,renameText,setRenameText})=>{const r=useRef(null);useEffect(()=>{if(r.current){r.current.focus();const d=renameText.lastIndexOf('.');if(d>0)r.current.setSelectionRange(0,d);else r.current.select();}},[]);return(<div className="modal-overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-header">Rename Document</div><input ref={r} type="text" className="modal-input" placeholder="New filename" value={renameText} onChange={e=>setRenameText(e.target.value)} onKeyPress={e=>e.key==='Enter'&&onSave()}/><div className="modal-buttons"><button className="modal-button secondary" onClick={onClose}>Cancel</button><button className="modal-button primary" onClick={onSave}>Rename</button></div></div></div>);};

ReactDOM.createRoot(document.getElementById('root')).render(<DocumentApp/>);
</script>
</body>
</html>
