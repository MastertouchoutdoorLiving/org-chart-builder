<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Storage - Master Touch Outdoor Living</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
        }

        html, body, #root {
            height: 100%;
            width: 100%;
        }

        #root {
            display: flex;
            flex-direction: column;
        }

        /* Header Styles */
        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid #334155;
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.25rem;
            color: white;
        }

        .header-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .header-right {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .back-link {
            color: #64748b;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .back-link:hover {
            background: #334155;
            color: #e2e8f0;
        }

        /* Main Container */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #1e293b;
            border-right: 1px solid #334155;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar-section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 0.05em;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            padding: 0 0.5rem;
        }

        .folder-item {
            padding: 0.75rem 1rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .folder-item:hover {
            background: #334155;
            border-color: #475569;
        }

        .folder-item.active {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-color: #6366f1;
            color: white;
        }

        .folder-name {
            font-weight: 500;
            flex: 1;
        }

        .folder-count {
            font-size: 0.8rem;
            opacity: 0.7;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .create-folder-btn {
            padding: 0.75rem 1rem;
            background: #3b82f6;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .create-folder-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .content-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .search-bar {
            padding: 0.75rem 1rem;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 0.95rem;
            min-width: 250px;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            outline: none;
            border-color: #3b82f6;
            background: #0f172a;
        }

        /* Upload Zone */
        .upload-section {
            padding: 2rem;
            border-bottom: 1px solid #334155;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(139, 92, 246, 0.05));
        }

        .upload-zone {
            border: 2px dashed #334155;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-zone:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }

        .upload-zone.drag-over {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .upload-zone input {
            display: none;
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            opacity: 0.7;
        }

        .upload-text {
            color: #e2e8f0;
            margin-bottom: 0.5rem;
        }

        .upload-subtext {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .upload-button {
            padding: 0.75rem 1.5rem;
            background: #3b82f6;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .upload-button:hover {
            background: #2563eb;
        }

        .file-size-warning {
            font-size: 0.85rem;
            color: #fbbf24;
            margin-top: 1rem;
        }

        /* Upload Progress */
        .upload-progress {
            margin-top: 1rem;
            padding: 1rem;
            background: #1e293b;
            border-radius: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            transition: width 0.3s ease;
        }

        /* Storage Indicator */
        .storage-info {
            padding: 1rem 2rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            background: #1e293b;
        }

        .storage-bar {
            flex: 1;
            min-width: 300px;
        }

        .storage-label {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .storage-progress {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
        }

        .storage-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            transition: background 0.3s ease, width 0.3s ease;
        }

        .storage-fill.warning {
            background: linear-gradient(90deg, #f59e0b, #ef4444);
        }

        /* Documents Section */
        .documents-section {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .documents-empty {
            text-align: center;
            padding: 3rem 1rem;
            color: #64748b;
        }

        .documents-empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Documents Table */
        .documents-table {
            width: 100%;
            border-collapse: collapse;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .table-header {
            border-bottom: 2px solid #334155;
            padding: 1rem 0;
        }

        .table-header-cell {
            text-align: left;
            color: #64748b;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.75rem;
            font-weight: 600;
        }

        .table-row {
            border-bottom: 1px solid #334155;
            transition: background 0.3s ease;
        }

        .table-row:hover {
            background: #1e293b;
        }

        .table-cell {
            padding: 1rem 0.75rem;
            vertical-align: middle;
        }

        .file-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            margin-right: 0.75rem;
            display: inline-flex;
        }

        .file-icon.pdf {
            background: #ef4444;
        }

        .file-icon.image {
            background: #10b981;
        }

        .file-icon.doc {
            background: #3b82f6;
        }

        .file-icon.spreadsheet {
            background: #10b981;
        }

        .file-icon.other {
            background: #6b7280;
        }

        .file-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            word-break: break-word;
        }

        .file-size {
            color: #64748b;
            font-size: 0.9rem;
        }

        .file-date {
            color: #64748b;
            font-size: 0.9rem;
        }

        .table-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .action-button {
            padding: 0.5rem 1rem;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 4px;
            color: #e2e8f0;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .action-button:hover {
            background: #475569;
            border-color: #64748b;
        }

        .action-button.delete {
            color: #fca5a5;
        }

        .action-button.delete:hover {
            background: #7f1d1d;
            border-color: #dc2626;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #e2e8f0;
        }

        .modal-input {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .modal-input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .modal-textarea {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }

        .modal-textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .modal-select {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .modal-select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .modal-select option {
            background: #1e293b;
            color: #e2e8f0;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        .modal-button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .modal-button.primary {
            background: #3b82f6;
            color: white;
        }

        .modal-button.primary:hover {
            background: #2563eb;
        }

        .modal-button.secondary {
            background: #334155;
            color: #e2e8f0;
        }

        .modal-button.secondary:hover {
            background: #475569;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #334155;
                max-height: 300px;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.5rem;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-right {
                width: 100%;
                justify-content: flex-end;
            }

            .content-header {
                flex-direction: column;
                align-items: stretch;
            }

            .search-bar {
                min-width: 100%;
            }

            .storage-info {
                flex-direction: column;
                align-items: stretch;
            }

            .storage-bar {
                min-width: auto;
            }

            .table-actions {
                gap: 0.25rem;
            }

            .action-button {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }

            .upload-zone {
                padding: 1rem;
            }

            .modal {
                width: 95%;
                padding: 1.5rem;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: #0f172a;
            color: #e2e8f0;
            text-align: center;
            border-radius: 6px;
            padding: 0.5rem;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
            border: 1px solid #334155;
            font-size: 0.85rem;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Utility Functions
        const generateId = () => crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;

        const formatFileSize = (bytes) => {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        };

        const getFileType = (filename) => {
            const ext = filename.split('.').pop().toLowerCase();
            if (['pdf'].includes(ext)) return 'pdf';
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) return 'image';
            if (['doc', 'docx', 'txt', 'rtf'].includes(ext)) return 'doc';
            if (['xls', 'xlsx', 'csv'].includes(ext)) return 'spreadsheet';
            return 'other';
        };

        const getFileIcon = (fileType) => {
            const icons = {
                pdf: '📄',
                image: '🖼️',
                doc: '📋',
                spreadsheet: '📊',
                other: '📦'
            };
            return icons[fileType] || '📦';
        };

        const formatDate = (date) => {
            return new Date(date).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        };

        const getApproximateStorageUsage = (documents) => {
            return documents.reduce((total, doc) => {
                return total + (doc.base64Data.length * 0.75);
            }, 0);
        };

        // Main App Component
        const DocumentApp = () => {
            const DEFAULT_FOLDERS = ['Insurance', 'Disclaimers', 'Contracts', 'Safety Documents', 'Employee Forms', 'Licenses & Permits', 'Other'];

            const [folders, setFolders] = useState(() => {
                const saved = localStorage.getItem('mt-folders');
                return saved ? JSON.parse(saved) : DEFAULT_FOLDERS;
            });

            const [documents, setDocuments] = useState(() => {
                const saved = localStorage.getItem('mt-documents');
                return saved ? JSON.parse(saved) : [];
            });

            const [selectedFolder, setSelectedFolder] = useState(DEFAULT_FOLDERS[0]);
            const [searchTerm, setSearchTerm] = useState('');
            const [uploadProgress, setUploadProgress] = useState(0);
            const [showUploadProgress, setShowUploadProgress] = useState(false);
            const [showCreateFolder, setShowCreateFolder] = useState(false);
            const [showNotes, setShowNotes] = useState(null);
            const [noteText, setNoteText] = useState('');
            const [showMoveFolder, setShowMoveFolder] = useState(null);
            const fileInputRef = useRef(null);

            // Persist to localStorage
            useEffect(() => {
                localStorage.setItem('mt-folders', JSON.stringify(folders));
            }, [folders]);

            useEffect(() => {
                localStorage.setItem('mt-documents', JSON.stringify(documents));
            }, [documents]);

            // Filter documents
            const filteredDocuments = documents.filter(doc => {
                const folderMatch = !selectedFolder || doc.folder === selectedFolder;
                const searchMatch = !searchTerm || doc.name.toLowerCase().includes(searchTerm.toLowerCase());
                return folderMatch && searchMatch;
            });

            // Get folder document count
            const getFolderCount = (folder) => {
                return documents.filter(doc => doc.folder === folder).length;
            };

            // Handle file upload
            const handleFileUpload = useCallback((files) => {
                Array.from(files).forEach((file, index) => {
                    if (file.size > 5 * 1024 * 1024) {
                        alert(`File "${file.name}" exceeds 5MB limit`);
                        return;
                    }

                    const reader = new FileReader();
                    reader.onprogress = (e) => {
                        if (e.lengthComputable) {
                            const percentComplete = ((index + (e.loaded / e.total)) / files.length) * 100;
                            setUploadProgress(Math.round(percentComplete));
                        }
                    };

                    reader.onload = (e) => {
                        const newDoc = {
                            id: generateId(),
                            name: file.name,
                            folder: selectedFolder,
                            fileType: getFileType(file.name),
                            fileSize: file.size,
                            base64Data: e.target.result,
                            uploadDate: new Date().toISOString(),
                            notes: ''
                        };
                        setDocuments(prev => [...prev, newDoc]);
                        setUploadProgress(((index + 1) / files.length) * 100);
                    };

                    reader.readAsDataURL(file);
                });

                setShowUploadProgress(true);
                setTimeout(() => {
                    setShowUploadProgress(false);
                    setUploadProgress(0);
                }, 2000);
            }, [selectedFolder]);

            // Handle drag and drop
            const handleDragOver = (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.currentTarget.classList.add('drag-over');
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.currentTarget.classList.remove('drag-over');
            };

            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.currentTarget.classList.remove('drag-over');
                handleFileUpload(e.dataTransfer.files);
            };

            // Download document
            const downloadDocument = (doc) => {
                const link = document.createElement('a');
                link.href = doc.base64Data;
                link.download = doc.name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Delete document
            const deleteDocument = (id) => {
                if (confirm('Are you sure you want to delete this document?')) {
                    setDocuments(prev => prev.filter(doc => doc.id !== id));
                }
            };

            // Create new folder
            const createFolder = (folderName) => {
                if (folderName.trim() && !folders.includes(folderName)) {
                    setFolders(prev => [...prev, folderName]);
                    setShowCreateFolder(false);
                }
            };

            // Move document to folder
            const moveDocument = (docId, newFolder) => {
                setDocuments(prev =>
                    prev.map(doc =>
                        doc.id === docId ? { ...doc, folder: newFolder } : doc
                    )
                );
                setShowMoveFolder(null);
            };

            // Update notes
            const updateNotes = (docId) => {
                setDocuments(prev =>
                    prev.map(doc =>
                        doc.id === docId ? { ...doc, notes: noteText } : doc
                    )
                );
                setShowNotes(null);
                setNoteText('');
            };

            const storageUsed = getApproximateStorageUsage(documents);
            const storageLimit = 5 * 1024 * 1024;
            const storagePercent = (storageUsed / storageLimit) * 100;

            return (
                <>
                    {/* Header */}
                    <div className="header">
                        <div className="header-left">
                            <div className="logo">MT</div>
                            <h1 className="header-title">Document Storage</h1>
                        </div>
                        <div className="header-right">
                            <a href="index.html" className="back-link">← Back to Hub</a>
                        </div>
                    </div>

                    <div className="container">
                        {/* Sidebar */}
                        <div className="sidebar">
                            <div className="sidebar-section-title">Folders</div>
                            {folders.map(folder => (
                                <div
                                    key={folder}
                                    className={`folder-item ${selectedFolder === folder ? 'active' : ''}`}
                                    onClick={() => setSelectedFolder(folder)}
                                >
                                    <span className="folder-name">📁 {folder}</span>
                                    <span className="folder-count">{getFolderCount(folder)}</span>
                                </div>
                            ))}
                            <button className="create-folder-btn" onClick={() => setShowCreateFolder(true)}>
                                + New Folder
                            </button>
                        </div>

                        {/* Main Content */}
                        <div className="main-content">
                            {/* Content Header */}
                            <div className="content-header">
                                <h2 className="content-title">{selectedFolder}</h2>
                                <input
                                    type="text"
                                    className="search-bar"
                                    placeholder="Search documents..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>

                            {/* Upload Zone */}
                            <div className="upload-section">
                                <div
                                    className="upload-zone"
                                    onDragOver={handleDragOver}
                                    onDragLeave={handleDragLeave}
                                    onDrop={handleDrop}
                                    onClick={() => fileInputRef.current?.click()}
                                >
                                    <input
                                        ref={fileInputRef}
                                        type="file"
                                        multiple
                                        onChange={(e) => handleFileUpload(e.target.files)}
                                    />
                                    <div className="upload-icon">📤</div>
                                    <div className="upload-text">Drag and drop files here</div>
                                    <div className="upload-subtext">or click to select files</div>
                                    <button className="upload-button">Choose Files</button>
                                    <div className="file-size-warning">⚠️ Max 5MB per file (localStorage limit)</div>
                                </div>

                                {showUploadProgress && (
                                    <div className="upload-progress">
                                        <div className="progress-bar">
                                            <div className="progress-fill" style={{ width: `${uploadProgress}%` }}></div>
                                        </div>
                                        <div style={{ fontSize: '0.9rem', color: '#64748b', textAlign: 'center' }}>
                                            Uploading... {Math.round(uploadProgress)}%
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Storage Info */}
                            <div className="storage-info">
                                <div className="storage-bar">
                                    <div className="storage-label">
                                        <span>Storage Used</span>
                                        <span>{formatFileSize(storageUsed)} / {formatFileSize(storageLimit)}</span>
                                    </div>
                                    <div className="storage-progress">
                                        <div
                                            className={`storage-fill ${storagePercent > 80 ? 'warning' : ''}`}
                                            style={{ width: `${Math.min(storagePercent, 100)}%` }}
                                        ></div>
                                    </div>
                                </div>
                                <span style={{ fontSize: '0.9rem', color: storagePercent > 80 ? '#ef4444' : '#64748b' }}>
                                    {Math.round(storagePercent)}% full
                                </span>
                            </div>

                            {/* Documents */}
                            <div className="documents-section">
                                {filteredDocuments.length === 0 ? (
                                    <div className="documents-empty">
                                        <div className="documents-empty-icon">📂</div>
                                        <p>{searchTerm ? 'No documents found' : 'No documents yet'}</p>
                                        <p style={{ fontSize: '0.9rem', marginTop: '0.5rem' }}>
                                            {searchTerm ? 'Try a different search term' : 'Upload a document to get started'}
                                        </p>
                                    </div>
                                ) : (
                                    <table className="documents-table">
                                        <thead className="table-header">
                                            <tr>
                                                <th className="table-header-cell">Name</th>
                                                <th className="table-header-cell">Size</th>
                                                <th className="table-header-cell">Date</th>
                                                <th className="table-header-cell">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredDocuments.map(doc => (
                                                <tr key={doc.id} className="table-row">
                                                    <td className="table-cell">
                                                        <div className="file-name">
                                                            <span className={`file-icon ${doc.fileType}`}>
                                                                {getFileIcon(doc.fileType)}
                                                            </span>
                                                            <span>{doc.name}</span>
                                                        </div>
                                                    </td>
                                                    <td className="table-cell file-size">
                                                        {formatFileSize(doc.fileSize)}
                                                    </td>
                                                    <td className="table-cell file-date">
                                                        {formatDate(doc.uploadDate)}
                                                    </td>
                                                    <td className="table-cell">
                                                        <div className="table-actions">
                                                            <button
                                                                className="action-button"
                                                                onClick={() => downloadDocument(doc)}
                                                                title="Download"
                                                            >
                                                                ⬇️ Download
                                                            </button>
                                                            <button
                                                                className="action-button"
                                                                onClick={() => {
                                                                    setShowNotes(doc.id);
                                                                    setNoteText(doc.notes || '');
                                                                }}
                                                                title="Add/Edit Notes"
                                                            >
                                                                📝 Notes
                                                            </button>
                                                            <button
                                                                className="action-button"
                                                                onClick={() => setShowMoveFolder(doc.id)}
                                                                title="Move to folder"
                                                            >
                                                                📁 Move
                                                            </button>
                                                            <button
                                                                className="action-button delete"
                                                                onClick={() => deleteDocument(doc.id)}
                                                                title="Delete"
                                                            >
                                                                🗑️ Delete
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Create Folder Modal */}
                    {showCreateFolder && (
                        <CreateFolderModal
                            onClose={() => setShowCreateFolder(false)}
                            onCreate={createFolder}
                            existingFolders={folders}
                        />
                    )}

                    {/* Notes Modal */}
                    {showNotes && (
                        <NotesModal
                            onClose={() => setShowNotes(null)}
                            onSave={() => updateNotes(showNotes)}
                            noteText={noteText}
                            setNoteText={setNoteText}
                        />
                    )}

                    {/* Move Folder Modal */}
                    {showMoveFolder && (
                        <MoveFolderModal
                            folders={folders}
                            currentFolder={documents.find(d => d.id === showMoveFolder)?.folder}
                            onClose={() => setShowMoveFolder(null)}
                            onMove={(newFolder) => moveDocument(showMoveFolder, newFolder)}
                        />
                    )}
                </>
            );
        };

        // Create Folder Modal
        const CreateFolderModal = ({ onClose, onCreate, existingFolders }) => {
            const [folderName, setFolderName] = useState('');
            const inputRef = useRef(null);

            useEffect(() => {
                inputRef.current?.focus();
            }, []);

            const handleCreate = () => {
                if (folderName.trim()) {
                    if (existingFolders.includes(folderName)) {
                        alert('Folder already exists');
                        return;
                    }
                    onCreate(folderName);
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">Create New Folder</div>
                        <input
                            ref={inputRef}
                            type="text"
                            className="modal-input"
                            placeholder="Folder name"
                            value={folderName}
                            onChange={(e) => setFolderName(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && handleCreate()}
                        />
                        <div className="modal-buttons">
                            <button className="modal-button secondary" onClick={onClose}>Cancel</button>
                            <button className="modal-button primary" onClick={handleCreate}>Create</button>
                        </div>
                    </div>
                </div>
            );
        };

        // Notes Modal
        const NotesModal = ({ onClose, onSave, noteText, setNoteText }) => {
            const textareaRef = useRef(null);

            useEffect(() => {
                textareaRef.current?.focus();
            }, []);

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">Document Notes</div>
                        <textarea
                            ref={textareaRef}
                            className="modal-textarea"
                            placeholder="Add notes about this document..."
                            value={noteText}
                            onChange={(e) => setNoteText(e.target.value)}
                        />
                        <div className="modal-buttons">
                            <button className="modal-button secondary" onClick={onClose}>Cancel</button>
                            <button className="modal-button primary" onClick={onSave}>Save Notes</button>
                        </div>
                    </div>
                </div>
            );
        };

        // Move Folder Modal
        const MoveFolderModal = ({ folders, currentFolder, onClose, onMove }) => {
            const [selectedFolder, setSelectedFolder] = useState(currentFolder);

            const availableFolders = folders.filter(f => f !== currentFolder);

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">Move Document</div>
                        <div style={{ marginBottom: '1rem' }}>Select destination folder:</div>
                        <select
                            className="modal-select"
                            value={selectedFolder}
                            onChange={(e) => setSelectedFolder(e.target.value)}
                        >
                            <option value="">-- Select Folder --</option>
                            {availableFolders.map(folder => (
                                <option key={folder} value={folder}>{folder}</option>
                            ))}
                        </select>
                        <div className="modal-buttons">
                            <button className="modal-button secondary" onClick={onClose}>Cancel</button>
                            <button
                                className="modal-button primary"
                                onClick={() => selectedFolder && onMove(selectedFolder)}
                                disabled={!selectedFolder}
                            >
                                Move
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DocumentApp />);
    </script>
</body>
</html>
