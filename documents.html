<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Storage - Master Touch Outdoor Living</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root[data-theme="dark"] {
            --bg-primary: #0C2637;
            --bg-secondary: #133A4F;
            --bg-tertiary: #1A4D65;
            --text-primary: #E0EDEE;
            --text-heading: #FFFFFF;
            --text-muted: #8AACB8;
            --border-color: #1A4D65;
            --accent-orange: #F47920;
            --accent-orange-hover: #E85D10;
            --accent-teal: #00BCC8;
            --accent-teal-light: #4DD8E0;
            --hover-bg: #1A4D65;
            --input-bg: #0C2637;
            --scrollbar-bg: #0F2F42;
            --scrollbar-thumb: #1A4D65;
            --scrollbar-thumb-hover: #1E5068;
            --tooltip-bg: #0C2637;
        }

        :root[data-theme="light"] {
            --bg-primary: #EFF3F5;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #D0DBE0;
            --text-primary: #2A3F4D;
            --text-heading: #132B3A;
            --text-muted: #5A7585;
            --border-color: #D0DBE0;
            --accent-orange: #E06A10;
            --accent-orange-hover: #C85809;
            --accent-teal: #00919B;
            --accent-teal-light: #1BA5B0;
            --hover-bg: #EFF3F5;
            --input-bg: #F5F7F8;
            --scrollbar-bg: #E8EDF0;
            --scrollbar-thumb: #C0CDD5;
            --scrollbar-thumb-hover: #A8BACC;
            --tooltip-bg: #FFFFFF;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background .3s, color .3s;
        }

        html, body, #root {
            height: 100%;
            width: 100%;
        }

        #root {
            display: flex;
            flex-direction: column;
        }

        /* Header Styles */
        .header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 2px solid var(--accent-orange);
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-right {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .theme-toggle {
            width: 44px;
            height: 44px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: var(--hover-bg);
            border-color: var(--accent-teal);
        }

        .back-link {
            color: var(--accent-teal);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .back-link:hover {
            background: var(--bg-secondary);
            color: var(--accent-teal-light);
        }

        /* Main Container */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar-section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            padding: 0 0.5rem;
        }

        .folder-item {
            padding: 0.75rem 1rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .folder-item:hover {
            background: var(--hover-bg);
            border-color: var(--bg-tertiary);
        }

        .folder-item.active {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-orange-hover));
            border-color: var(--accent-orange);
            color: white;
        }

        .folder-name {
            font-weight: 500;
            flex: 1;
        }

        .folder-count {
            font-size: 0.8rem;
            opacity: 0.7;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .create-folder-btn {
            padding: 0.75rem 1rem;
            background: var(--accent-orange);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .create-folder-btn:hover {
            background: var(--accent-orange-hover);
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .content-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .search-bar {
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.95rem;
            min-width: 250px;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--accent-orange);
            background: var(--input-bg);
        }

        /* Upload Zone */
        .upload-section {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, rgba(244,121,32,.08), rgba(0,188,200,.08));
        }

        .upload-zone {
            border: 2px dashed var(--accent-teal);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-zone:hover {
            border-color: var(--accent-teal-light);
            background: rgba(0,188,200,.08);
        }

        .upload-zone.drag-over {
            border-color: var(--accent-teal-light);
            background: rgba(0,188,200,.15);
        }

        .upload-zone input {
            display: none;
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            opacity: 0.7;
        }

        .upload-text {
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .upload-subtext {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .upload-button {
            padding: 0.75rem 1.5rem;
            background: var(--accent-orange);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .upload-button:hover {
            background: var(--accent-orange-hover);
        }

        .file-size-warning {
            font-size: 0.85rem;
            color: #F49D50;
            margin-top: 1rem;
        }

        /* Upload Progress */
        .upload-progress {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-teal));
            transition: width 0.3s ease;
        }

        /* Storage Indicator */
        .storage-info {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            background: var(--bg-secondary);
        }

        .storage-bar {
            flex: 1;
            min-width: 300px;
        }

        .storage-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .storage-progress {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .storage-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-teal), var(--accent-teal-light));
            transition: background 0.3s ease, width 0.3s ease;
        }

        .storage-fill.warning {
            background: linear-gradient(90deg, #F49D50, var(--accent-orange-hover));
        }

        /* Documents Section */
        .documents-section {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .documents-empty {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .documents-empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Documents Table */
        .documents-table {
            width: 100%;
            border-collapse: collapse;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .table-header {
            border-bottom: 2px solid var(--border-color);
            padding: 1rem 0;
        }

        .table-header-cell {
            text-align: left;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.75rem;
            font-weight: 600;
        }

        .table-row {
            border-bottom: 1px solid var(--border-color);
            transition: background 0.3s ease;
        }

        .table-row:hover {
            background: var(--bg-secondary);
        }

        .table-cell {
            padding: 1rem 0.75rem;
            vertical-align: middle;
        }

        .file-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            margin-right: 0.75rem;
            display: inline-flex;
        }

        .file-icon.pdf {
            background: #ef4444;
        }

        .file-icon.image {
            background: #10b981;
        }

        .file-icon.doc {
            background: var(--accent-orange);
        }

        .file-icon.spreadsheet {
            background: #10b981;
        }

        .file-icon.other {
            background: #6b7280;
        }

        .file-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            word-break: break-word;
        }

        .file-size {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .file-date {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .table-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .action-button {
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .action-button:hover {
            background: var(--hover-bg);
            border-color: var(--accent-teal);
        }

        .action-button.delete {
            color: #fca5a5;
        }

        .action-button.delete:hover {
            background: #7f1d1d;
            border-color: #dc2626;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-heading);
        }

        .modal-input {
            width: 100%;
            padding: 0.75rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--accent-orange);
        }

        .modal-textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }

        .modal-textarea:focus {
            outline: none;
            border-color: var(--accent-orange);
        }

        .modal-select {
            width: 100%;
            padding: 0.75rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .modal-select:focus {
            outline: none;
            border-color: var(--accent-orange);
        }

        .modal-select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        .modal-button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .modal-button.primary {
            background: var(--accent-orange);
            color: white;
        }

        .modal-button.primary:hover {
            background: var(--accent-orange-hover);
        }

        .modal-button.secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .modal-button.secondary:hover {
            background: var(--hover-bg);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                max-height: 300px;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.5rem;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-right {
                width: 100%;
                justify-content: flex-end;
            }

            .content-header {
                flex-direction: column;
                align-items: stretch;
            }

            .search-bar {
                min-width: 100%;
            }

            .storage-info {
                flex-direction: column;
                align-items: stretch;
            }

            .storage-bar {
                min-width: auto;
            }

            .table-actions {
                gap: 0.25rem;
            }

            .action-button {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }

            .upload-zone {
                padding: 1rem;
            }

            .modal {
                width: 95%;
                padding: 1.5rem;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: var(--tooltip-bg);
            color: var(--text-primary);
            text-align: center;
            border-radius: 6px;
            padding: 0.5rem;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Utility Functions
        const generateId = () => crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;

        const formatFileSize = (bytes) => {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        };

        const getFileType = (filename) => {
            const ext = filename.split('.').pop().toLowerCase();
            if (['pdf'].includes(ext)) return 'pdf';
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) return 'image';
            if (['doc', 'docx', 'txt', 'rtf'].includes(ext)) return 'doc';
            if (['xls', 'xlsx', 'csv'].includes(ext)) return 'spreadsheet';
            return 'other';
        };

        const getFileIcon = (fileType) => {
            const icons = {
                pdf: '📄',
                image: '🖼️',
                doc: '📋',
                spreadsheet: '📊',
                other: '📦'
            };
            return icons[fileType] || '📦';
        };

        const formatDate = (date) => {
            return new Date(date).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        };

        const getApproximateStorageUsage = (documents) => {
            return documents.reduce((total, doc) => {
                return total + (doc.base64Data.length * 0.75);
            }, 0);
        };

        // Main App Component
        const DocumentApp = () => {
            const DEFAULT_FOLDERS = ['Insurance', 'Disclaimers', 'Contracts', 'Safety Documents', 'Employee Forms', 'Licenses & Permits', 'Other'];

            const [theme, setTheme] = useState(() => {
                return localStorage.getItem('mt-theme') || 'dark';
            });

            const [folders, setFolders] = useState(() => {
                const saved = localStorage.getItem('mt-folders');
                return saved ? JSON.parse(saved) : DEFAULT_FOLDERS;
            });

            const [documents, setDocuments] = useState(() => {
                const saved = localStorage.getItem('mt-documents');
                return saved ? JSON.parse(saved) : [];
            });

            const [selectedFolder, setSelectedFolder] = useState(DEFAULT_FOLDERS[0]);
            const [searchTerm, setSearchTerm] = useState('');
            const [uploadProgress, setUploadProgress] = useState(0);
            const [showUploadProgress, setShowUploadProgress] = useState(false);
            const [showCreateFolder, setShowCreateFolder] = useState(false);
            const [showNotes, setShowNotes] = useState(null);
            const [noteText, setNoteText] = useState('');
            const [showMoveFolder, setShowMoveFolder] = useState(null);
            const [showRename, setShowRename] = useState(null);
            const [renameText, setRenameText] = useState('');
            const fileInputRef = useRef(null);

            // Initialize theme on mount
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('mt-theme', theme);
            }, [theme]);

            // Persist to localStorage
            useEffect(() => {
                localStorage.setItem('mt-folders', JSON.stringify(folders));
            }, [folders]);

            useEffect(() => {
                localStorage.setItem('mt-documents', JSON.stringify(documents));
            }, [documents]);

            // Toggle theme
            const toggleTheme = () => {
                setTheme(prevTheme => prevTheme === 'dark' ? 'light' : 'dark');
            };

            // Filter documents
            const filteredDocuments = documents.filter(doc => {
                const folderMatch = !selectedFolder || doc.folder === selectedFolder;
                const searchMatch = !searchTerm || doc.name.toLowerCase().includes(searchTerm.toLowerCase());
                return folderMatch && searchMatch;
            });

            // Get folder document count
            const getFolderCount = (folder) => {
                return documents.filter(doc => doc.folder === folder).length;
            };

            // Handle file upload
            const handleFileUpload = useCallback((files) => {
                Array.from(files).forEach((file, index) => {
                    if (file.size > 5 * 1024 * 1024) {
                        alert(`File "${file.name}" exceeds 5MB limit`);
                        return;
                    }

                    const reader = new FileReader();
                    reader.onprogress = (e) => {
                        if (e.lengthComputable) {
                            const percentComplete = ((index + (e.loaded / e.total)) / files.length) * 100;
                            setUploadProgress(Math.round(percentComplete));
                        }
                    };

                    reader.onload = (e) => {
                        const newDoc = {
                            id: generateId(),
                            name: file.name,
                            folder: selectedFolder,
                            fileType: getFileType(file.name),
                            fileSize: file.size,
                            base64Data: e.target.result,
                            uploadDate: new Date().toISOString(),
                            notes: ''
                        };
                        setDocuments(prev => [...prev, newDoc]);
                        setUploadProgress(((index + 1) / files.length) * 100);
                    };

                    reader.readAsDataURL(file);
                });

                setShowUploadProgress(true);
                setTimeout(() => {
                    setShowUploadProgress(false);
                    setUploadProgress(0);
                }, 2000);
            }, [selectedFolder]);

            // Handle drag and drop
            const handleDragOver = (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.currentTarget.classList.add('drag-over');
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.currentTarget.classList.remove('drag-over');
            };

            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.currentTarget.classList.remove('drag-over');
                handleFileUpload(e.dataTransfer.files);
            };

            // Download document
            const downloadDocument = (doc) => {
                const link = document.createElement('a');
                link.href = doc.base64Data;
                link.download = doc.name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Delete document
            const deleteDocument = (id) => {
                if (confirm('Are you sure you want to delete this document?')) {
                    setDocuments(prev => prev.filter(doc => doc.id !== id));
                }
            };

            // Create new folder
            const createFolder = (folderName) => {
                if (folderName.trim() && !folders.includes(folderName)) {
                    setFolders(prev => [...prev, folderName]);
                    setShowCreateFolder(false);
                }
            };

            // Move document to folder
            const moveDocument = (docId, newFolder) => {
                setDocuments(prev =>
                    prev.map(doc =>
                        doc.id === docId ? { ...doc, folder: newFolder } : doc
                    )
                );
                setShowMoveFolder(null);
            };

            // Update notes
            const updateNotes = (docId) => {
                setDocuments(prev =>
                    prev.map(doc =>
                        doc.id === docId ? { ...doc, notes: noteText } : doc
                    )
                );
                setShowNotes(null);
                setNoteText('');
            };

            // Rename document
            const renameDocument = (docId) => {
                if (renameText.trim()) {
                    setDocuments(prev =>
                        prev.map(doc =>
                            doc.id === docId ? { ...doc, name: renameText.trim() } : doc
                        )
                    );
                }
                setShowRename(null);
                setRenameText('');
            };

            const storageUsed = getApproximateStorageUsage(documents);
            const storageLimit = 5 * 1024 * 1024;
            const storagePercent = (storageUsed / storageLimit) * 100;

            return (
                <>
                    {/* Header */}
                    <div className="header">
                        <div className="header-left">
                            <svg className="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                                <defs><linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#F47920"/><stop offset="100%" stopColor="#E85D10"/></linearGradient></defs>
                                <path d="M50 5 L90 25 L90 55 Q90 80 50 95 Q10 80 10 55 L10 25 Z" fill="url(#shield)" opacity=".15" stroke="#F47920" strokeWidth="1.5"/>
                                <text x="50" y="62" textAnchor="middle" fontFamily="Georgia,serif" fontSize="40" fontWeight="bold" fontStyle="italic" fill="#F47920">M</text>
                                <text x="62" y="72" textAnchor="middle" fontFamily="Georgia,serif" fontSize="22" fontWeight="bold" fontStyle="italic" fill="#00BCC8">t</text>
                            </svg>
                            <h1 className="header-title">Document Storage</h1>
                        </div>
                        <div className="header-right">
                            <button
                                className="theme-toggle"
                                onClick={toggleTheme}
                                title={theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}
                            >
                                {theme === 'dark' ? '☀️' : '🌙'}
                            </button>
                            <a href="index.html" className="back-link">← Back to Hub</a>
                        </div>
                    </div>

                    <div className="container">
                        {/* Sidebar */}
                        <div className="sidebar">
                            <div className="sidebar-section-title">Folders</div>
                            {folders.map(folder => (
                                <div
                                    key={folder}
                                    className={`folder-item ${selectedFolder === folder ? 'active' : ''}`}
                                    onClick={() => setSelectedFolder(folder)}
                                >
                                    <span className="folder-name">📁 {folder}</span>
                                    <span className="folder-count">{getFolderCount(folder)}</span>
                                </div>
                            ))}
                            <button className="create-folder-btn" onClick={() => setShowCreateFolder(true)}>
                                + New Folder
                            </button>
                        </div>

                        {/* Main Content */}
                        <div className="main-content">
                            {/* Content Header */}
                            <div className="content-header">
                                <h2 className="content-title">{selectedFolder}</h2>
                                <input
                                    type="text"
                                    className="search-bar"
                                    placeholder="Search documents..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>

                            {/* Upload Zone */}
                            <div className="upload-section">
                                <div
                                    className="upload-zone"
                                    onDragOver={handleDragOver}
                                    onDragLeave={handleDragLeave}
                                    onDrop={handleDrop}
                                    onClick={() => fileInputRef.current?.click()}
                                >
                                    <input
                                        ref={fileInputRef}
                                        type="file"
                                        multiple
                                        onChange={(e) => handleFileUpload(e.target.files)}
                                    />
                                    <div className="upload-icon">📤</div>
                                    <div className="upload-text">Drag and drop files here</div>
                                    <div className="upload-subtext">or click to select files</div>
                                    <button className="upload-button">Choose Files</button>
                                    <div className="file-size-warning">⚠️ Max 5MB per file (localStorage limit)</div>
                                </div>

                                {showUploadProgress && (
                                    <div className="upload-progress">
                                        <div className="progress-bar">
                                            <div className="progress-fill" style={{ width: `${uploadProgress}%` }}></div>
                                        </div>
                                        <div style={{ fontSize: '0.9rem', color: 'var(--text-muted)', textAlign: 'center' }}>
                                            Uploading... {Math.round(uploadProgress)}%
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Storage Info */}
                            <div className="storage-info">
                                <div className="storage-bar">
                                    <div className="storage-label">
                                        <span>Storage Used</span>
                                        <span>{formatFileSize(storageUsed)} / {formatFileSize(storageLimit)}</span>
                                    </div>
                                    <div className="storage-progress">
                                        <div
                                            className={`storage-fill ${storagePercent > 80 ? 'warning' : ''}`}
                                            style={{ width: `${Math.min(storagePercent, 100)}%` }}
                                        ></div>
                                    </div>
                                </div>
                                <span style={{ fontSize: '0.9rem', color: storagePercent > 80 ? '#ef4444' : 'var(--text-muted)' }}>
                                    {Math.round(storagePercent)}% full
                                </span>
                            </div>

                            {/* Documents */}
                            <div className="documents-section">
                                {filteredDocuments.length === 0 ? (
                                    <div className="documents-empty">
                                        <div className="documents-empty-icon">📂</div>
                                        <p>{searchTerm ? 'No documents found' : 'No documents yet'}</p>
                                        <p style={{ fontSize: '0.9rem', marginTop: '0.5rem' }}>
                                            {searchTerm ? 'Try a different search term' : 'Upload a document to get started'}
                                        </p>
                                    </div>
                                ) : (
                                    <table className="documents-table">
                                        <thead className="table-header">
                                            <tr>
                                                <th className="table-header-cell">Name</th>
                                                <th className="table-header-cell">Size</th>
                                                <th className="table-header-cell">Date</th>
                                                <th className="table-header-cell">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredDocuments.map(doc => (
                                                <tr key={doc.id} className="table-row">
                                                    <td className="table-cell">
                                                        <div className="file-name">
                                                            <span className={`file-icon ${doc.fileType}`}>
                                                                {getFileIcon(doc.fileType)}
                                                            </span>
                                                            <span>{doc.name}</span>
                                                        </div>
                                                    </td>
                                                    <td className="table-cell file-size">
                                                        {formatFileSize(doc.fileSize)}
                                                    </td>
                                                    <td className="table-cell file-date">
                                                        {formatDate(doc.uploadDate)}
                                                    </td>
                                                    <td className="table-cell">
                                                        <div className="table-actions">
                                                            <button
                                                                className="action-button"
                                                                onClick={() => {
                                                                    setShowRename(doc.id);
                                                                    setRenameText(doc.name);
                                                                }}
                                                                title="Rename"
                                                            >
                                                                ✏️ Rename
                                                            </button>
                                                            <button
                                                                className="action-button"
                                                                onClick={() => downloadDocument(doc)}
                                                                title="Download"
                                                            >
                                                                ⬇️ Download
                                                            </button>
                                                            <button
                                                                className="action-button"
                                                                onClick={() => {
                                                                    setShowNotes(doc.id);
                                                                    setNoteText(doc.notes || '');
                                                                }}
                                                                title="Add/Edit Notes"
                                                            >
                                                                📝 Notes
                                                            </button>
                                                            <button
                                                                className="action-button"
                                                                onClick={() => setShowMoveFolder(doc.id)}
                                                                title="Move to folder"
                                                            >
                                                                📁 Move
                                                            </button>
                                                            <button
                                                                className="action-button delete"
                                                                onClick={() => deleteDocument(doc.id)}
                                                                title="Delete"
                                                            >
                                                                🗑️ Delete
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Create Folder Modal */}
                    {showCreateFolder && (
                        <CreateFolderModal
                            onClose={() => setShowCreateFolder(false)}
                            onCreate={createFolder}
                            existingFolders={folders}
                        />
                    )}

                    {/* Notes Modal */}
                    {showNotes && (
                        <NotesModal
                            onClose={() => setShowNotes(null)}
                            onSave={() => updateNotes(showNotes)}
                            noteText={noteText}
                            setNoteText={setNoteText}
                        />
                    )}

                    {/* Move Folder Modal */}
                    {showMoveFolder && (
                        <MoveFolderModal
                            folders={folders}
                            currentFolder={documents.find(d => d.id === showMoveFolder)?.folder}
                            onClose={() => setShowMoveFolder(null)}
                            onMove={(newFolder) => moveDocument(showMoveFolder, newFolder)}
                        />
                    )}

                    {/* Rename Modal */}
                    {showRename && (
                        <RenameModal
                            onClose={() => { setShowRename(null); setRenameText(''); }}
                            onSave={() => renameDocument(showRename)}
                            renameText={renameText}
                            setRenameText={setRenameText}
                        />
                    )}
                </>
            );
        };

        // Create Folder Modal
        const CreateFolderModal = ({ onClose, onCreate, existingFolders }) => {
            const [folderName, setFolderName] = useState('');
            const inputRef = useRef(null);

            useEffect(() => {
                inputRef.current?.focus();
            }, []);

            const handleCreate = () => {
                if (folderName.trim()) {
                    if (existingFolders.includes(folderName)) {
                        alert('Folder already exists');
                        return;
                    }
                    onCreate(folderName);
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">Create New Folder</div>
                        <input
                            ref={inputRef}
                            type="text"
                            className="modal-input"
                            placeholder="Folder name"
                            value={folderName}
                            onChange={(e) => setFolderName(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && handleCreate()}
                        />
                        <div className="modal-buttons">
                            <button className="modal-button secondary" onClick={onClose}>Cancel</button>
                            <button className="modal-button primary" onClick={handleCreate}>Create</button>
                        </div>
                    </div>
                </div>
            );
        };

        // Notes Modal
        const NotesModal = ({ onClose, onSave, noteText, setNoteText }) => {
            const textareaRef = useRef(null);

            useEffect(() => {
                textareaRef.current?.focus();
            }, []);

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">Document Notes</div>
                        <textarea
                            ref={textareaRef}
                            className="modal-textarea"
                            placeholder="Add notes about this document..."
                            value={noteText}
                            onChange={(e) => setNoteText(e.target.value)}
                        />
                        <div className="modal-buttons">
                            <button className="modal-button secondary" onClick={onClose}>Cancel</button>
                            <button className="modal-button primary" onClick={onSave}>Save Notes</button>
                        </div>
                    </div>
                </div>
            );
        };

        // Move Folder Modal
        const MoveFolderModal = ({ folders, currentFolder, onClose, onMove }) => {
            const [selectedFolder, setSelectedFolder] = useState(currentFolder);

            const availableFolders = folders.filter(f => f !== currentFolder);

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">Move Document</div>
                        <div style={{ marginBottom: '1rem' }}>Select destination folder:</div>
                        <select
                            className="modal-select"
                            value={selectedFolder}
                            onChange={(e) => setSelectedFolder(e.target.value)}
                        >
                            <option value="">-- Select Folder --</option>
                            {availableFolders.map(folder => (
                                <option key={folder} value={folder}>{folder}</option>
                            ))}
                        </select>
                        <div className="modal-buttons">
                            <button className="modal-button secondary" onClick={onClose}>Cancel</button>
                            <button
                                className="modal-button primary"
                                onClick={() => selectedFolder && onMove(selectedFolder)}
                                disabled={!selectedFolder}
                            >
                                Move
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Rename Modal
        const RenameModal = ({ onClose, onSave, renameText, setRenameText }) => {
            const inputRef = useRef(null);

            useEffect(() => {
                if (inputRef.current) {
                    inputRef.current.focus();
                    // Select just the filename part (before the last dot)
                    const lastDot = renameText.lastIndexOf('.');
                    if (lastDot > 0) {
                        inputRef.current.setSelectionRange(0, lastDot);
                    } else {
                        inputRef.current.select();
                    }
                }
            }, []);

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-header">Rename Document</div>
                        <input
                            ref={inputRef}
                            type="text"
                            className="modal-input"
                            placeholder="Enter new filename"
                            value={renameText}
                            onChange={(e) => setRenameText(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && onSave()}
                        />
                        <div className="modal-buttons">
                            <button className="modal-button secondary" onClick={onClose}>Cancel</button>
                            <button className="modal-button primary" onClick={onSave}>Rename</button>
                        </div>
                    </div>
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DocumentApp />);
    </script>
</body>
</html>
