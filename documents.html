<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Storage - Master Touch Outdoor Living</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root[data-theme="dark"] {
            --bg-primary: #0C2637;
            --bg-secondary: #133A4F;
            --bg-tertiary: #1A4D65;
            --text-primary: #E0EDEE;
            --text-heading: #FFFFFF;
            --text-muted: #8AACB8;
            --border-color: #1A4D65;
            --accent-orange: #F47920;
            --accent-orange-hover: #E85D10;
            --accent-teal: #00BCC8;
            --accent-teal-light: #4DD8E0;
            --hover-bg: #1A4D65;
            --input-bg: #0C2637;
            --scrollbar-bg: #0F2F42;
            --scrollbar-thumb: #1A4D65;
            --scrollbar-thumb-hover: #1E5068;
            --tooltip-bg: #0C2637;
        }

        :root[data-theme="light"] {
            --bg-primary: #EFF3F5;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #D0DBE0;
            --text-primary: #2A3F4D;
            --text-heading: #132B3A;
            --text-muted: #5A7585;
            --border-color: #D0DBE0;
            --accent-orange: #E06A10;
            --accent-orange-hover: #C85809;
            --accent-teal: #00919B;
            --accent-teal-light: #1BA5B0;
            --hover-bg: #EFF3F5;
            --input-bg: #F5F7F8;
            --scrollbar-bg: #E8EDF0;
            --scrollbar-thumb: #C0CDD5;
            --scrollbar-thumb-hover: #A8BACC;
            --tooltip-bg: #FFFFFF;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background .3s, color .3s;
        }

        html, body, #root {
            height: 100%;
            width: 100%;
        }

        #root {
            display: flex;
            flex-direction: column;
        }

        /* Header Styles */
        .header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 2px solid var(--accent-orange);
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-heading);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-button {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 2px solid var(--accent-orange);
            color: var(--accent-orange);
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-button:hover {
            background: var(--accent-orange);
            color: white;
        }

        .theme-toggle {
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
        }

        .theme-toggle:hover {
            background: var(--hover-bg);
            border-color: var(--accent-orange);
        }

        .activity-log-btn {
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 44px;
        }

        .activity-log-btn:hover {
            background: var(--hover-bg);
            border-color: var(--accent-orange);
        }

        /* Activity Log Drawer */
        .activity-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100%;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.2);
            z-index: 997;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .activity-drawer.open {
            right: 0;
        }

        .drawer-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .drawer-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-heading);
        }

        .drawer-close-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .drawer-close-btn:hover {
            color: var(--accent-orange);
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .audit-entry {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
        }

        .audit-entry:last-child {
            border-bottom: none;
        }

        .audit-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
            min-width: 30px;
            text-align: center;
        }

        .audit-details {
            flex: 1;
            min-width: 0;
        }

        .audit-description {
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 0.25rem;
            word-break: break-word;
        }

        .audit-time {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 996;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .folder-section {
            margin-bottom: 2rem;
        }

        .folder-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .folder-list {
            list-style: none;
        }

        .folder-item {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-primary);
        }

        .folder-item:hover {
            background: var(--hover-bg);
        }

        .folder-item.active {
            background: var(--accent-orange);
            color: white;
            font-weight: 600;
        }

        .folder-item-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            min-width: 0;
        }

        .folder-expand-toggle {
            background: transparent;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 0;
            width: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .folder-name {
            flex: 1;
            min-width: 0;
        }

        .folder-count {
            font-size: 0.8rem;
            opacity: 0.7;
            flex-shrink: 0;
        }

        .subfolder-item {
            padding: 0.5rem 0.75rem 0.5rem 2rem;
            margin-bottom: 0.3rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .subfolder-item:hover {
            background: var(--hover-bg);
        }

        .subfolder-item.active {
            background: var(--accent-orange);
            color: white;
            font-weight: 600;
        }

        .subfolder-list {
            list-style: none;
        }

        .add-folder-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent-teal);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 1rem;
            transition: all 0.3s;
        }

        .add-folder-btn:hover {
            background: var(--accent-teal-light);
        }

        /* Content Area */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 1.5rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .content-title-section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .breadcrumb {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .search-box {
            padding: 0.75rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            width: 300px;
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 2px rgba(0, 188, 200, 0.1);
        }

        .upload-area {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .subfolders-section {
            margin-bottom: 2rem;
        }

        .subfolders-header {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subfolders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .subfolder-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .subfolder-card:hover {
            border-color: var(--accent-orange);
            background: var(--hover-bg);
        }

        .subfolder-card-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .subfolder-card-name {
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 0.25rem;
            word-break: break-word;
        }

        .subfolder-card-count {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .add-subfolder-btn {
            padding: 0.75rem 1rem;
            background: var(--accent-teal);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .add-subfolder-btn:hover {
            background: var(--accent-teal-light);
        }

        .upload-section {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 2rem;
        }

        .upload-section:hover,
        .upload-section.drag-over {
            border-color: var(--accent-teal);
            background: rgba(0, 188, 200, 0.05);
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .upload-text {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .upload-subtext {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .file-size-warning {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }

        #fileInput {
            display: none;
        }

        /* Document List */
        .document-list {
            display: grid;
            gap: 1rem;
            margin-top: 1rem;
        }

        .document-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .document-item:hover {
            border-color: var(--accent-orange);
            background: var(--hover-bg);
        }

        .document-info {
            flex: 1;
            min-width: 0;
        }

        .document-name {
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 0.25rem;
            word-break: break-word;
        }

        .document-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .document-actions {
            display: flex;
            gap: 0.5rem;
            margin-left: 1rem;
            flex-shrink: 0;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--accent-orange);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.5rem;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .icon-btn:hover {
            background: var(--accent-orange);
            color: white;
        }

        .icon-btn.delete:hover {
            background: #ff4444;
            color: white;
        }

        /* Upload Progress */
        .upload-progress {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--accent-orange);
            height: 4px;
            transition: width 0.3s;
            z-index: 1000;
        }

        .upload-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-teal));
            transition: width 0.3s;
            width: 0%;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 2rem;
            min-width: 400px;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 1rem;
        }

        .modal-input {
            width: 100%;
            padding: 0.75rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--accent-teal);
        }

        .modal-textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 150px;
        }

        .modal-textarea:focus {
            outline: none;
            border-color: var(--accent-teal);
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--accent-orange);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-orange-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--hover-bg);
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        /* Toast Styles */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-orange);
            padding: 1rem 1.5rem;
            border-radius: 4px;
            z-index: 1001;
            animation: slideIn 0.3s ease;
        }

        .toast.error {
            border-left-color: #ff4444;
        }

        .toast.success {
            border-left-color: var(--accent-teal);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid rgba(244, 121, 32, 0.2);
            border-top-color: var(--accent-orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 998;
        }

        .loading-content {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
        }

        .loading-text {
            margin-top: 1rem;
            color: var(--text-primary);
        }

        /* Scrollbar Styles */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                max-height: 200px;
                display: flex;
                gap: 2rem;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 1rem;
            }

            .folder-section {
                margin-bottom: 0;
                white-space: nowrap;
            }

            .search-box {
                width: 100%;
                max-width: 100%;
            }

            .modal {
                min-width: 90%;
                max-width: 90%;
                padding: 1.5rem;
            }

            .document-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .document-actions {
                margin-left: 0;
                margin-top: 1rem;
                width: 100%;
            }

            .toast {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
            }

            .activity-drawer {
                width: 100%;
                right: -100%;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 1rem;
            }

            .header-title {
                font-size: 1.3rem;
            }

            .content-header {
                padding: 1rem;
            }

            .upload-area {
                padding: 1rem;
            }

            .upload-section {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useCallback, useRef, useEffect } = React;

        // Supabase initialization
        const supabaseUrl = 'https://jpieratyhqxkwbjzcjqk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwaWVyYXR5aHF4a3dianpjanFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4NDY3NzIsImV4cCI6MjA4ODQyMjc3Mn0.Dr0IDpWxWy8hHIKwlckDWvFNx6gmzQghhbqQgy4jRiI';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Utility functions
        const generateId = () => {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        };

        const getFileType = (filename) => {
            const ext = filename.split('.').pop().toLowerCase();
            const types = {
                pdf: '📄',
                doc: '📝',
                docx: '📝',
                xls: '📊',
                xlsx: '📊',
                ppt: '📺',
                pptx: '📺',
                jpg: '🖼️',
                jpeg: '🖼️',
                png: '🖼️',
                gif: '🖼️',
                zip: '📦',
                rar: '📦'
            };
            return types[ext] || '📎';
        };

        const formatFileSize = (bytes) => {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        };

        const formatDate = (isoString) => {
            const date = new Date(isoString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        };

        const getRelativeTime = (isoString) => {
            const date = new Date(isoString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString();
        };

        // Toast component
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`toast ${type}`}>
                    {message}
                </div>
            );
        };

        // Loading overlay
        const LoadingOverlay = ({ visible }) => {
            if (!visible) return null;
            return (
                <div className="loading-overlay">
                    <div className="loading-content">
                        <div className="spinner"></div>
                        <div className="loading-text">Loading files...</div>
                    </div>
                </div>
            );
        };

        // Audit Trail helper
        const logAudit = async (action, details, fileName, folder) => {
            try {
                let auditLog = [];

                // Fetch current audit log
                try {
                    const { data } = await supabase.storage
                        .from('company-documents')
                        .download('_audit/audit-log.json');

                    if (data) {
                        const text = await data.text();
                        auditLog = JSON.parse(text);
                    }
                } catch (e) {
                    // File doesn't exist yet, start with empty array
                    auditLog = [];
                }

                // Create new entry
                const newEntry = {
                    id: generateId(),
                    action,
                    details,
                    timestamp: new Date().toISOString(),
                    fileName: fileName || null,
                    folder: folder || null
                };

                // Prepend new entry and trim to 500 max
                auditLog.unshift(newEntry);
                auditLog = auditLog.slice(0, 500);

                // Upload back to Supabase
                const blob = new Blob([JSON.stringify(auditLog, null, 2)], { type: 'application/json' });
                await supabase.storage
                    .from('company-documents')
                    .upload('_audit/audit-log.json', blob, { upsert: true });

            } catch (error) {
                console.error('Audit logging error:', error);
            }
        };

        // Main App Component
        const DocumentApp = () => {
            const DEFAULT_FOLDERS = ['Insurance', 'Disclaimers', 'Contracts', 'Safety Documents', 'Employee Forms', 'Licenses & Permits', 'Other'];

            const [theme, setTheme] = useState(() => {
                return localStorage.getItem('mt-theme') || 'dark';
            });

            const [folders, setFolders] = useState(() => {
                const saved = localStorage.getItem('mt-folders');
                return saved ? JSON.parse(saved) : DEFAULT_FOLDERS;
            });

            const [expandedFolders, setExpandedFolders] = useState({});
            const [documents, setDocuments] = useState([]);
            const [selectedFolder, setSelectedFolder] = useState(DEFAULT_FOLDERS[0]);
            const [selectedSubfolder, setSelectedSubfolder] = useState(null);
            const [subfolders, setSubfolders] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [uploadProgress, setUploadProgress] = useState(0);
            const [showUploadProgress, setShowUploadProgress] = useState(false);
            const [showCreateFolder, setShowCreateFolder] = useState(false);
            const [showCreateSubfolder, setShowCreateSubfolder] = useState(false);
            const [showNotes, setShowNotes] = useState(null);
            const [noteText, setNoteText] = useState('');
            const [showMoveFolder, setShowMoveFolder] = useState(null);
            const [showRename, setShowRename] = useState(null);
            const [renameText, setRenameText] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);
            const [toastType, setToastType] = useState('success');
            const [isUploading, setIsUploading] = useState(false);
            const [showActivityLog, setShowActivityLog] = useState(false);
            const [auditLog, setAuditLog] = useState([]);
            const fileInputRef = useRef(null);

            // Initialize theme on mount
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('mt-theme', theme);
            }, [theme]);

            // Persist folders to localStorage
            useEffect(() => {
                localStorage.setItem('mt-folders', JSON.stringify(folders));
            }, [folders]);

            // Load files and subfolders when folder/subfolder changes
            useEffect(() => {
                loadDocuments(selectedFolder, selectedSubfolder);
                loadSubfolders(selectedFolder);
            }, [selectedFolder, selectedSubfolder]);

            // Load subfolders from Supabase
            const loadSubfolders = async (folderName) => {
                try {
                    const { data, error } = await supabase.storage
                        .from('company-documents')
                        .list(folderName, { limit: 100, sortBy: { column: 'name', order: 'asc' } });

                    if (error || !data) {
                        setSubfolders([]);
                        return;
                    }

                    // Filter for folders (items with id: null)
                    const folders = data.filter(item => item.id === null && item.name !== '.keep');
                    setSubfolders(folders.map(f => f.name));
                } catch (error) {
                    console.error('Error loading subfolders:', error);
                    setSubfolders([]);
                }
            };

            // Load documents from Supabase
            const loadDocuments = async (folderName, subfolder) => {
                setIsLoading(true);
                try {
                    const listPath = subfolder ? `${folderName}/${subfolder}` : folderName;
                    const { data, error } = await supabase.storage
                        .from('company-documents')
                        .list(listPath, { limit: 100, sortBy: { column: 'created_at', order: 'desc' } });

                    if (error) {
                        console.error('Error loading files:', error);
                        showToast('Failed to load files', 'error');
                        setDocuments([]);
                        return;
                    }

                    if (!data) {
                        setDocuments([]);
                        return;
                    }

                    // Filter out .keep files and folders
                    const docs = data
                        .filter(file => !file.name.endsWith('.keep') && file.id !== null)
                        .map(file => {
                            const fileSize = file.metadata?.size || 0;
                            return {
                                id: file.id,
                                name: file.name,
                                folder: folderName,
                                subfolder: subfolder || null,
                                fileType: getFileType(file.name),
                                fileSize: fileSize,
                                uploadDate: file.created_at,
                                path: subfolder ? `${folderName}/${subfolder}/${file.name}` : `${folderName}/${file.name}`
                            };
                        });

                    setDocuments(docs);
                } catch (error) {
                    console.error('Unexpected error loading documents:', error);
                    showToast('An error occurred while loading files', 'error');
                    setDocuments([]);
                } finally {
                    setIsLoading(false);
                }
            };

            // Show toast notification
            const showToast = (message, type = 'success') => {
                setToastMessage(message);
                setToastType(type);
            };

            // Toggle theme
            const toggleTheme = () => {
                setTheme(prevTheme => prevTheme === 'dark' ? 'light' : 'dark');
            };

            // Load activity log
            const loadActivityLog = async () => {
                try {
                    const { data } = await supabase.storage
                        .from('company-documents')
                        .download('_audit/audit-log.json');

                    if (data) {
                        const text = await data.text();
                        const log = JSON.parse(text);
                        setAuditLog(log.slice(0, 100)); // Show last 100
                    } else {
                        setAuditLog([]);
                    }
                } catch (error) {
                    console.error('Error loading audit log:', error);
                    setAuditLog([]);
                }
            };

            // Open activity log drawer
            const openActivityLog = async () => {
                setShowActivityLog(true);
                await loadActivityLog();
            };

            // Filter documents
            const filteredDocuments = documents.filter(doc => {
                const searchMatch = !searchTerm || doc.name.toLowerCase().includes(searchTerm.toLowerCase());
                return searchMatch;
            });

            // Get folder document count (including subfolders)
            const getFolderCount = (folder) => {
                return documents.filter(doc => doc.folder === folder).length;
            };

            // Get subfolder document count
            const getSubfolderCount = (folder, subfolder) => {
                return documents.filter(doc => doc.folder === folder && doc.subfolder === subfolder).length;
            };

            // Get action icon for audit entry
            const getAuditIcon = (action) => {
                const icons = {
                    'upload': '📤',
                    'rename': '✏️',
                    'delete': '🗑️',
                    'move': '➡️',
                    'folder_created': '📁',
                    'subfolder_created': '📂'
                };
                return icons[action] || '📋';
            };

            // Handle file upload
            const handleFileUpload = useCallback(async (files) => {
                if (!files || files.length === 0) return;

                setIsUploading(true);
                let uploadedCount = 0;

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];

                    if (file.size > 50 * 1024 * 1024) { // 50MB limit
                        showToast(`File "${file.name}" exceeds 50MB limit`, 'error');
                        continue;
                    }

                    try {
                        const timestamp = Date.now();
                        const basePath = selectedSubfolder
                            ? `${selectedFolder}/${selectedSubfolder}`
                            : selectedFolder;
                        const filePath = `${basePath}/${timestamp}_${file.name}`;

                        const { data, error } = await supabase.storage
                            .from('company-documents')
                            .upload(filePath, file, {
                                cacheControl: '3600',
                                upsert: false
                            });

                        if (error) {
                            console.error('Upload error:', error);
                            showToast(`Failed to upload "${file.name}"`, 'error');
                        } else {
                            uploadedCount++;
                            const folder = selectedSubfolder ? `${selectedFolder}/${selectedSubfolder}` : selectedFolder;
                            await logAudit('upload', `Uploaded '${file.name}' to ${folder}`, file.name, folder);
                            setUploadProgress(Math.round(((i + 1) / files.length) * 100));
                        }
                    } catch (error) {
                        console.error('Upload exception:', error);
                        showToast(`Error uploading "${file.name}"`, 'error');
                    }
                }

                setShowUploadProgress(true);
                setUploadProgress(100);

                setTimeout(() => {
                    setShowUploadProgress(false);
                    setUploadProgress(0);
                    setIsUploading(false);
                    loadDocuments(selectedFolder, selectedSubfolder);

                    if (uploadedCount > 0) {
                        showToast(`Successfully uploaded ${uploadedCount} file(s)`, 'success');
                    }
                }, 1500);
            }, [selectedFolder, selectedSubfolder]);

            // Handle drag and drop
            const handleDragOver = (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.currentTarget.classList.add('drag-over');
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.currentTarget.classList.remove('drag-over');
            };

            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                e.currentTarget.classList.remove('drag-over');
                handleFileUpload(e.dataTransfer.files);
            };

            // Download document
            const downloadDocument = async (doc) => {
                try {
                    const { data, error } = supabase.storage
                        .from('company-documents')
                        .getPublicUrl(doc.path);

                    if (error) {
                        console.error('Error getting download URL:', error);
                        showToast('Failed to download file', 'error');
                        return;
                    }

                    const link = document.createElement('a');
                    link.href = data.publicUrl;
                    link.download = doc.name;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (error) {
                    console.error('Download error:', error);
                    showToast('Failed to download file', 'error');
                }
            };

            // Delete document
            const deleteDocument = async (id, path, fileName, folder) => {
                if (!confirm('Are you sure you want to delete this document?')) return;

                try {
                    const { error } = await supabase.storage
                        .from('company-documents')
                        .remove([path]);

                    if (error) {
                        console.error('Delete error:', error);
                        showToast('Failed to delete file', 'error');
                    } else {
                        await logAudit('delete', `Deleted '${fileName}' from ${folder}`, fileName, folder);
                        showToast('Document deleted successfully', 'success');
                        localStorage.removeItem(`mt-doc-notes-${path}`);
                        setDocuments(prev => prev.filter(doc => doc.id !== id));
                    }
                } catch (error) {
                    console.error('Delete exception:', error);
                    showToast('Failed to delete file', 'error');
                }
            };

            // Create new folder
            const createFolder = async (folderName) => {
                if (!folderName.trim() || folders.includes(folderName)) {
                    showToast('Folder name is invalid or already exists', 'error');
                    return;
                }

                try {
                    const { error } = await supabase.storage
                        .from('company-documents')
                        .upload(`${folderName}/.keep`, new Blob(['']), {
                            cacheControl: '3600',
                            upsert: true
                        });

                    if (error) {
                        console.error('Folder creation error:', error);
                        showToast('Failed to create folder', 'error');
                    } else {
                        setFolders(prev => [...prev, folderName]);
                        setShowCreateFolder(false);
                        await logAudit('folder_created', `Created folder '${folderName}'`, null, folderName);
                        showToast('Folder created successfully', 'success');
                    }
                } catch (error) {
                    console.error('Folder creation exception:', error);
                    showToast('Failed to create folder', 'error');
                }
            };

            // Create subfolder
            const createSubfolder = async (subfolderName) => {
                if (!subfolderName.trim()) {
                    showToast('Subfolder name is invalid', 'error');
                    return;
                }

                if (subfolders.includes(subfolderName)) {
                    showToast('Subfolder already exists', 'error');
                    return;
                }

                try {
                    const { error } = await supabase.storage
                        .from('company-documents')
                        .upload(`${selectedFolder}/${subfolderName}/.keep`, new Blob(['']), {
                            cacheControl: '3600',
                            upsert: true
                        });

                    if (error) {
                        console.error('Subfolder creation error:', error);
                        showToast('Failed to create subfolder', 'error');
                    } else {
                        setShowCreateSubfolder(false);
                        await logAudit('subfolder_created', `Created subfolder '${selectedFolder}/${subfolderName}'`, null, `${selectedFolder}/${subfolderName}`);
                        showToast('Subfolder created successfully', 'success');
                        loadSubfolders(selectedFolder);
                    }
                } catch (error) {
                    console.error('Subfolder creation exception:', error);
                    showToast('Failed to create subfolder', 'error');
                }
            };

            // Move document to folder
            const moveDocument = async (docId, newFolder, oldPath) => {
                try {
                    const newPath = `${newFolder}/${oldPath.split('/').pop()}`;

                    const { error } = await supabase.storage
                        .from('company-documents')
                        .move(oldPath, newPath);

                    if (error) {
                        console.error('Move error:', error);
                        showToast('Failed to move file', 'error');
                    } else {
                        const fileName = oldPath.split('/').pop();
                        await logAudit('move', `Moved '${fileName}' from ${documents.find(d => d.id === docId)?.folder} to ${newFolder}`, fileName, newFolder);
                        setDocuments(prev =>
                            prev.map(doc =>
                                doc.id === docId ? { ...doc, folder: newFolder, path: newPath } : doc
                            )
                        );
                        setShowMoveFolder(null);
                        showToast('Document moved successfully', 'success');
                    }
                } catch (error) {
                    console.error('Move exception:', error);
                    showToast('Failed to move file', 'error');
                }
            };

            // Update notes
            const updateNotes = (docPath) => {
                localStorage.setItem(`mt-doc-notes-${docPath}`, noteText);
                setShowNotes(null);
                setNoteText('');
                showToast('Notes saved', 'success');
            };

            // Get notes for a document
            const getNotes = (docPath) => {
                return localStorage.getItem(`mt-doc-notes-${docPath}`) || '';
            };

            // Rename document
            const renameDocument = async (docId, oldPath) => {
                if (!renameText.trim()) {
                    showToast('File name cannot be empty', 'error');
                    return;
                }

                try {
                    const pathParts = oldPath.split('/');
                    const fileName = pathParts[pathParts.length - 1];
                    const folder = pathParts[0];
                    const timestamp = fileName.split('_')[0];
                    const newFileName = renameText.trim();
                    const newPath = oldPath.substring(0, oldPath.lastIndexOf('/') + 1) + timestamp + '_' + newFileName;

                    const { error } = await supabase.storage
                        .from('company-documents')
                        .move(oldPath, newPath);

                    if (error) {
                        console.error('Rename error:', error);
                        showToast('Failed to rename file', 'error');
                    } else {
                        const oldNotes = localStorage.getItem(`mt-doc-notes-${oldPath}`);
                        if (oldNotes) {
                            localStorage.removeItem(`mt-doc-notes-${oldPath}`);
                            localStorage.setItem(`mt-doc-notes-${newPath}`, oldNotes);
                        }

                        await logAudit('rename', `Renamed '${fileName}' to '${timestamp}_${newFileName}'`, newFileName, folder);
                        setDocuments(prev =>
                            prev.map(doc =>
                                doc.id === docId ? { ...doc, name: newFileName, path: newPath } : doc
                            )
                        );
                        setShowRename(null);
                        setRenameText('');
                        showToast('File renamed successfully', 'success');
                    }
                } catch (error) {
                    console.error('Rename exception:', error);
                    showToast('Failed to rename file', 'error');
                }
            };

            // Toggle folder expansion
            const toggleFolderExpand = (folder) => {
                setExpandedFolders(prev => ({
                    ...prev,
                    [folder]: !prev[folder]
                }));
            };

            return (
                <>
                    {/* Header */}
                    <div className="header">
                        <div className="header-left">
                            <svg className="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                                <defs><linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#F47920"/><stop offset="100%" stopColor="#E85D10"/></linearGradient></defs>
                                <path d="M50 5 L90 25 L90 55 Q90 80 50 95 Q10 80 10 55 L10 25 Z" fill="url(#shield)" opacity=".15" stroke="#F47920" strokeWidth="1.5"/>
                                <circle cx="50" cy="50" r="15" fill="#F47920" opacity=".3"/>
                            </svg>
                            <div className="header-title">Document Storage</div>
                        </div>
                        <div className="header-right">
                            <button className="activity-log-btn" onClick={openActivityLog} title="Activity Log">
                                📋 Activity Log
                            </button>
                            <button className="theme-toggle" onClick={toggleTheme} title="Toggle theme">
                                {theme === 'dark' ? '☀️' : '🌙'}
                            </button>
                            <button className="back-button" onClick={() => window.location.href = 'index.html'}>
                                ← Back to Hub
                            </button>
                        </div>
                    </div>

                    {/* Upload Progress Bar */}
                    {showUploadProgress && (
                        <div className="upload-progress">
                            <div className="upload-progress-bar" style={{ width: `${uploadProgress}%` }}></div>
                        </div>
                    )}

                    {/* Main Content */}
                    <div className="main-content">
                        {/* Sidebar */}
                        <div className="sidebar">
                            <div className="folder-section">
                                <div className="folder-title">📁 Folders</div>
                                <ul className="folder-list">
                                    {folders.map(folder => (
                                        <li key={folder}>
                                            <div
                                                className={`folder-item ${selectedFolder === folder && !selectedSubfolder ? 'active' : ''}`}
                                                onClick={() => {
                                                    setSelectedFolder(folder);
                                                    setSelectedSubfolder(null);
                                                }}
                                            >
                                                <div className="folder-item-left">
                                                    <button
                                                        className="folder-expand-toggle"
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            toggleFolderExpand(folder);
                                                        }}
                                                    >
                                                        {expandedFolders[folder] ? '▼' : '▶'}
                                                    </button>
                                                    <span className="folder-name">{folder}</span>
                                                </div>
                                                <span className="folder-count">({getFolderCount(folder)})</span>
                                            </div>
                                            {expandedFolders[folder] && selectedFolder === folder && subfolders.length > 0 && (
                                                <ul className="subfolder-list">
                                                    {subfolders.map(subfolder => (
                                                        <li
                                                            key={subfolder}
                                                            className={`subfolder-item ${selectedSubfolder === subfolder ? 'active' : ''}`}
                                                            onClick={() => setSelectedSubfolder(subfolder)}
                                                        >
                                                            📂 {subfolder} ({getSubfolderCount(folder, subfolder)})
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}
                                        </li>
                                    ))}
                                </ul>
                                <button className="add-folder-btn" onClick={() => setShowCreateFolder(true)}>
                                    + New Folder
                                </button>
                            </div>
                        </div>

                        {/* Content Area */}
                        <div className="content">
                            <div className="content-header">
                                <div className="content-title-section">
                                    <h2 style={{ color: 'var(--text-heading)' }}>
                                        {selectedSubfolder ? `${selectedFolder} / ${selectedSubfolder}` : selectedFolder}
                                    </h2>
                                    {selectedSubfolder && (
                                        <div className="breadcrumb">
                                            <span onClick={() => setSelectedSubfolder(null)} style={{ cursor: 'pointer', color: 'var(--accent-orange)' }}>
                                                {selectedFolder}
                                            </span>
                                            <span>/</span>
                                            <span>{selectedSubfolder}</span>
                                        </div>
                                    )}
                                </div>
                                <input
                                    type="text"
                                    className="search-box"
                                    placeholder="🔍 Search documents..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>

                            <div
                                className="upload-area"
                                onDragOver={handleDragOver}
                                onDragLeave={handleDragLeave}
                                onDrop={handleDrop}
                            >
                                {selectedSubfolder === null && subfolders.length > 0 && (
                                    <div className="subfolders-section">
                                        <div className="subfolders-header">
                                            Subfolders
                                            <button className="add-subfolder-btn" onClick={() => setShowCreateSubfolder(true)}>
                                                + New Subfolder
                                            </button>
                                        </div>
                                        <div className="subfolders-grid">
                                            {subfolders.map(subfolder => (
                                                <div
                                                    key={subfolder}
                                                    className="subfolder-card"
                                                    onClick={() => setSelectedSubfolder(subfolder)}
                                                >
                                                    <div className="subfolder-card-icon">📂</div>
                                                    <div className="subfolder-card-name">{subfolder}</div>
                                                    <div className="subfolder-card-count">
                                                        {getSubfolderCount(selectedFolder, subfolder)} file{getSubfolderCount(selectedFolder, subfolder) !== 1 ? 's' : ''}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {selectedSubfolder === null && subfolders.length === 0 && (
                                    <button className="add-subfolder-btn" onClick={() => setShowCreateSubfolder(true)} style={{ alignSelf: 'flex-start', marginBottom: '2rem' }}>
                                        + New Subfolder
                                    </button>
                                )}

                                {filteredDocuments.length === 0 ? (
                                    <div
                                        className="upload-section"
                                        onClick={() => fileInputRef.current?.click()}
                                    >
                                        <div className="upload-icon">📤</div>
                                        <div className="upload-text">Drag files here or click to upload</div>
                                        <div className="upload-subtext">Supported formats: PDF, DOC, XLS, PNG, JPG, and more</div>
                                        {isUploading && <div style={{ marginTop: '1rem' }}><div className="spinner"></div></div>}
                                        <div className="file-size-warning">⚠️ Max 50MB per file</div>
                                    </div>
                                ) : (
                                    <div className="document-list">
                                        {filteredDocuments.map(doc => (
                                            <div key={doc.id} className="document-item">
                                                <div className="document-info">
                                                    <div className="document-name">
                                                        {doc.fileType} {doc.name}
                                                    </div>
                                                    <div className="document-meta">
                                                        {formatFileSize(doc.fileSize)} • {formatDate(doc.uploadDate)}
                                                    </div>
                                                </div>
                                                <div className="document-actions">
                                                    <button
                                                        className="icon-btn"
                                                        onClick={() => {
                                                            setShowNotes(doc.id);
                                                            setNoteText(getNotes(doc.path));
                                                        }}
                                                        title="Add notes"
                                                    >
                                                        📝
                                                    </button>
                                                    <button
                                                        className="icon-btn"
                                                        onClick={() => downloadDocument(doc)}
                                                        title="Download"
                                                    >
                                                        ⬇️
                                                    </button>
                                                    <button
                                                        className="icon-btn"
                                                        onClick={() => {
                                                            setShowRename(doc.id);
                                                            setRenameText(doc.name);
                                                        }}
                                                        title="Rename"
                                                    >
                                                        ✏️
                                                    </button>
                                                    <button
                                                        className="icon-btn"
                                                        onClick={() => setShowMoveFolder(doc.id)}
                                                        title="Move"
                                                    >
                                                        ➡️
                                                    </button>
                                                    <button
                                                        className="icon-btn delete"
                                                        onClick={() => deleteDocument(doc.id, doc.path, doc.name, doc.subfolder ? `${doc.folder}/${doc.subfolder}` : doc.folder)}
                                                        title="Delete"
                                                    >
                                                        🗑️
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <input
                                    ref={fileInputRef}
                                    type="file"
                                    id="fileInput"
                                    multiple
                                    onChange={(e) => handleFileUpload(e.target.files)}
                                />
                            </div>
                        </div>
                    </div>

                    {/* Activity Log Drawer */}
                    <div className={`drawer-overlay ${showActivityLog ? 'open' : ''}`} onClick={() => setShowActivityLog(false)}></div>
                    <div className={`activity-drawer ${showActivityLog ? 'open' : ''}`}>
                        <div className="drawer-header">
                            <div className="drawer-title">Activity Log</div>
                            <button className="drawer-close-btn" onClick={() => setShowActivityLog(false)}>✕</button>
                        </div>
                        <div className="drawer-content">
                            {auditLog.length === 0 ? (
                                <div style={{ color: 'var(--text-muted)', textAlign: 'center', paddingTop: '2rem' }}>
                                    No activity recorded yet
                                </div>
                            ) : (
                                auditLog.map(entry => (
                                    <div key={entry.id} className="audit-entry">
                                        <div className="audit-icon">{getAuditIcon(entry.action)}</div>
                                        <div className="audit-details">
                                            <div className="audit-description">{entry.details}</div>
                                            <div className="audit-time">{getRelativeTime(entry.timestamp)}</div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    {/* Create Folder Modal */}
                    {showCreateFolder && (
                        <div className="modal-overlay" onClick={() => setShowCreateFolder(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-title">Create New Folder</div>
                                <input
                                    type="text"
                                    className="modal-input"
                                    placeholder="Folder name"
                                    onKeyPress={(e) => {
                                        if (e.key === 'Enter') {
                                            createFolder(e.target.value);
                                        }
                                    }}
                                    autoFocus
                                    id="folderInput"
                                />
                                <div className="modal-buttons">
                                    <button className="btn btn-secondary" onClick={() => setShowCreateFolder(false)}>
                                        Cancel
                                    </button>
                                    <button
                                        className="btn btn-primary"
                                        onClick={() => {
                                            const input = document.getElementById('folderInput');
                                            createFolder(input.value);
                                        }}
                                    >
                                        Create
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Create Subfolder Modal */}
                    {showCreateSubfolder && (
                        <div className="modal-overlay" onClick={() => setShowCreateSubfolder(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-title">Create New Subfolder</div>
                                <input
                                    type="text"
                                    className="modal-input"
                                    placeholder="Subfolder name"
                                    onKeyPress={(e) => {
                                        if (e.key === 'Enter') {
                                            createSubfolder(e.target.value);
                                        }
                                    }}
                                    autoFocus
                                    id="subfolderInput"
                                />
                                <div className="modal-buttons">
                                    <button className="btn btn-secondary" onClick={() => setShowCreateSubfolder(false)}>
                                        Cancel
                                    </button>
                                    <button
                                        className="btn btn-primary"
                                        onClick={() => {
                                            const input = document.getElementById('subfolderInput');
                                            createSubfolder(input.value);
                                        }}
                                    >
                                        Create
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Notes Modal */}
                    {showNotes && (
                        <div className="modal-overlay" onClick={() => setShowNotes(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-title">Document Notes</div>
                                <textarea
                                    className="modal-textarea"
                                    value={noteText}
                                    onChange={(e) => setNoteText(e.target.value)}
                                    placeholder="Add notes about this document..."
                                    autoFocus
                                />
                                <div className="modal-buttons">
                                    <button className="btn btn-secondary" onClick={() => setShowNotes(null)}>
                                        Cancel
                                    </button>
                                    <button
                                        className="btn btn-primary"
                                        onClick={() => {
                                            const doc = documents.find(d => d.id === showNotes);
                                            if (doc) updateNotes(doc.path);
                                        }}
                                    >
                                        Save Notes
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Rename Modal */}
                    {showRename && (
                        <div className="modal-overlay" onClick={() => setShowRename(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-title">Rename Document</div>
                                <input
                                    type="text"
                                    className="modal-input"
                                    value={renameText}
                                    onChange={(e) => setRenameText(e.target.value)}
                                    onKeyPress={(e) => {
                                        if (e.key === 'Enter') {
                                            const doc = documents.find(d => d.id === showRename);
                                            if (doc) renameDocument(showRename, doc.path);
                                        }
                                    }}
                                    autoFocus
                                />
                                <div className="modal-buttons">
                                    <button className="btn btn-secondary" onClick={() => setShowRename(null)}>
                                        Cancel
                                    </button>
                                    <button
                                        className="btn btn-primary"
                                        onClick={() => {
                                            const doc = documents.find(d => d.id === showRename);
                                            if (doc) renameDocument(showRename, doc.path);
                                        }}
                                    >
                                        Rename
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Move Folder Modal */}
                    {showMoveFolder && (
                        <div className="modal-overlay" onClick={() => setShowMoveFolder(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-title">Move to Folder</div>
                                <div style={{ maxHeight: '300px', overflowY: 'auto', marginBottom: '1rem' }}>
                                    {folders.map(folder => {
                                        const doc = documents.find(d => d.id === showMoveFolder);
                                        if (folder === doc?.folder) return null;
                                        return (
                                            <button
                                                key={folder}
                                                className="btn btn-secondary"
                                                style={{
                                                    display: 'block',
                                                    width: '100%',
                                                    textAlign: 'left',
                                                    marginBottom: '0.5rem',
                                                    padding: '0.75rem 1rem'
                                                }}
                                                onClick={() => {
                                                    const doc = documents.find(d => d.id === showMoveFolder);
                                                    if (doc) moveDocument(showMoveFolder, folder, doc.path);
                                                }}
                                            >
                                                {folder}
                                            </button>
                                        );
                                    })}
                                </div>
                                <div className="modal-buttons">
                                    <button className="btn btn-secondary" onClick={() => setShowMoveFolder(null)}>
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Loading Overlay */}
                    <LoadingOverlay visible={isLoading} />

                    {/* Toast Notification */}
                    {toastMessage && (
                        <Toast
                            message={toastMessage}
                            type={toastType}
                            onClose={() => setToastMessage(null)}
                        />
                    )}
                </>
            );
        };

        // Render app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DocumentApp />);
    </script>
</body>
</html>
